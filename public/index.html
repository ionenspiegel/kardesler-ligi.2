(function() {
  window._krdLiveS = window._krdLiveS || null;
  const origFetch = window.fetch;
  window.fetch = async function(...args) {
    const res = await origFetch.apply(this, args);
    try {
      const c = res.clone();
      if ((c.headers.get('content-type') || '').includes('application/json')) {
        c.json().then(d => {
          if (d && Array.isArray(d.teams) && Array.isArray(d.matches)) {
            window._krdLiveS = d;
          }
        }).catch(() => {});
      }
    } catch {}
    return res;
  };
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(rs => {
      rs.forEach(r => r.unregister());
    }).catch(() => {});
  }
})();

<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={settings:{},teams:[],matches:[],table:[],goals:[],archives:[]},ME={},tab='m',wk=0,htab='ozet',selTeam=null,story=null,goalMatch=null,archView=null,h2hA=0,h2hB=0,bump=null;
let sfxOn=localStorage.getItem('kl_sfx')!=='0';

function playSfx(type){
 if(!sfxOn)return;
 try{
  const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;
  const ctx=new Ctx(),now=ctx.currentTime;
  if(type==='goal'){
   [523.25,659.25,783.99,1046.5].forEach((freq,i)=>{
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='triangle';o.frequency.setValueAtTime(freq,now+i*.08);
    g.gain.setValueAtTime(.18,now+i*.08);g.gain.exponentialRampToValueAtTime(.001,now+i*.08+.35);
    o.connect(g);g.connect(ctx.destination);o.start(now+i*.08);o.stop(now+i*.08+.36);
   });
  }else if(type==='whistle'){
   [0,.22].forEach((d,i)=>{
    const o=ctx.createOscillator(),g=ctx.createGain(),len=i?.42:.14;
    o.type='sine';o.frequency.setValueAtTime(2850,now+d);o.frequency.linearRampToValueAtTime(2650,now+d+len);
    g.gain.setValueAtTime(.14,now+d);g.gain.exponentialRampToValueAtTime(.001,now+d+len);
    o.connect(g);g.connect(ctx.destination);o.start(now+d);o.stop(now+d+len+.02);
   });
  }
 }catch{}
}
function toggleSfx(){sfxOn=!sfxOn;localStorage.setItem('kl_sfx',sfxOn?'1':'0');toast(sfxOn?'Ses efektleri açıldı':'Ses efektleri kapatıldı');render()}

async function api(m,u,b){const r=await fetch(u,{method:m,headers:{'Content-Type':'application/json','X-KL':'1'},body:b?JSON.stringify(b):undefined});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Hata');return d}
function toast(t,err){const e=$('#toast');e.textContent=t;e.className='show'+(err?' err':'');clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='',2600)}
async function act(f,ok){try{await f();if(ok)toast(ok);await load();render()}catch(e){toast(e.message,1)}}
async function load(){[S,ME]=await Promise.all([api('GET','/api/league'),api('GET','/api/me')]);if(S.settings?.name)document.title=`${S.settings.name} — ${S.settings.season||''}`}
const T=id=>S.teams.find(t=>t.id===id)||{name:'?',color:'#888'};
const badge=(t,sz)=>`<span class="b" style="--c:${esc(t.color)};${sz?`min-width:${sz}px;width:${sz}px;height:${sz}px;font-size:${Math.max(9,Math.round(sz*.34))}px;margin-right:6px`:''}">${esc(t.short||t.name.slice(0,3).toUpperCase())}</span>`;
const badgePure=(t,sz)=>`<span class="b" style="--c:${esc(t.color)};min-width:${sz}px;width:${sz}px;height:${sz}px;font-size:${Math.max(9,Math.round(sz*.34))}px;margin:0">${esc(t.short||t.name.slice(0,3).toUpperCase())}</span>`;

function scorerBoard(){
 const playedIds=new Set(S.matches.filter(m=>m.played).map(m=>m.id));
 const map={};
 for(const g of (S.goals||[])){
  if(!playedIds.has(g.match_id))continue;
  const k=g.player.toLowerCase()+'|'+g.team_id;
  if(!map[k])map[k]={player:g.player,team_id:g.team_id,goals:0,assists:0};
  map[k].goals+=g.goals;map[k].assists+=g.assists;
 }
 return Object.values(map).sort((a,b)=>b.goals-a.goals||b.assists-a.assists||a.player.localeCompare(b.player,'tr'));
}

function liveStandings(){
 const liveMs=S.matches.filter(m=>!m.played&&(m.hs>0||m.aws>0));
 if(!liveMs.length)return {rows:S.table.map(t=>({...t,diff:0})),hasLive:false};
 const s=S.settings,W=+s.win,D=+s.draw,L=+s.loss,baseRank={};
 S.table.forEach((t,i)=>baseRank[t.id]=i);
 const M={};
 S.table.forEach(t=>M[t.id]={...t});
 for(const m of liveMs){
  const h=M[m.home_id],a=M[m.away_id];if(!h||!a)continue;
  h.p++;a.p++;h.gf+=m.hs;h.ga+=m.aws;a.gf+=m.aws;a.ga+=m.hs;
  if(m.hs>m.aws){h.w++;a.l++;h.pts+=W;a.pts+=L}else if(m.hs<m.aws){a.w++;h.l++;a.pts+=W;h.pts+=L}else{h.d++;a.d++;h.pts+=D;a.pts+=D}
 }
 const sorted=Object.values(M).map(t=>({...t,gd:t.gf-t.ga})).sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf||a.name.localeCompare(b.name,'tr'));
 return {rows:sorted.map((t,i)=>({...t,diff:(baseRank[t.id]??i)-i})),hasLive:true};
}

function formOf(id){
 return S.matches.filter(m=>m.played&&(m.home_id===id||m.away_id===id))
  .sort((a,b)=>(a.updated||'').localeCompare(b.updated||'')||a.week-b.week||a.id-b.id)
  .slice(-5).map(m=>{const h=m.home_id===id,g1=h?m.hs:m.aws,g2=h?m.aws:m.hs;return g1>g2?'G':g1<g2?'M':'B'});
}

function statsBar(){
 const pl=S.matches.filter(m=>m.played);if(!pl.length||!S.table.length)return '';
 const topG=[...S.table].sort((a,b)=>b.gf-a.gf||b.pts-a.pts)[0];
 const playedTeams=S.table.filter(t=>t.p>0);
 const topD=playedTeams.length?[...playedTeams].sort((a,b)=>a.ga-b.ga||b.pts-a.pts)[0]:null;
 const big=[...pl].sort((a,b)=>Math.abs(b.hs-b.aws)-Math.abs(a.hs-a.aws)||(b.hs+b.aws)-(a.hs+a.aws))[0];
 const bh=T(big.home_id),ba=T(big.away_id);
 let bestStreak={name:'',cnt:0};
 for(const t of S.teams){
  let cur=0,mx=0;
  S.matches.filter(m=>m.played&&(m.home_id===t.id||m.away_id===t.id))
   .sort((a,b)=>(a.updated||'').localeCompare(b.updated||'')||a.week-b.week||a.id-b.id)
   .forEach(m=>{const h=m.home_id===t.id,win=h?m.hs>m.aws:m.aws>m.hs;if(win){cur++;if(cur>mx)mx=cur}else cur=0});
  if(mx>bestStreak.cnt)bestStreak={name:t.name,cnt:mx};
 }
 const totGoals=pl.reduce((s,m)=>s+m.hs+m.aws,0),avg=(totGoals/pl.length).toFixed(1);
 const sc=scorerBoard()[0];
 return `<div class="stats">
  <div class="st"><small>🔥 En Golcü Takım</small><b>${esc(topG.name)} (${topG.gf} gol)</b></div>
  ${topD?`<div class="st"><small>🛡️ En İyi Savunma</small><b>${esc(topD.name)} (${topD.ga} gol yedi)</b></div>`:''}
  <div class="st"><small>⚡ En Farklı Skor (H${big.week})</small><b>${esc(bh.name)} ${big.hs} - ${big.aws} ${esc(ba.name)}</b></div>
  ${bestStreak.cnt>1?`<div class="st"><small>🚀 En Uzun Galibiyet Serisi</small><b>${esc(bestStreak.name)} (${bestStreak.cnt} maç)</b></div>`:''}
  <div class="st"><small>⚽ Gol Ortalaması</small><b>Maç başı ${avg} gol</b></div>
  ${sc?`<div class="st"><small>👑 Gol Kralı</small><b>${esc(sc.player)} (${sc.goals} gol)</b></div>`:''}
 </div>`;
}

function remainingData(){
 const unplayed=S.matches.filter(m=>!m.played);
 return S.teams.map(t=>{
  const rem=unplayed.filter(m=>m.home_id===t.id||m.away_id===t.id).sort((a,b)=>a.week-b.week||a.id-b.id);
  const items=rem.map(m=>{
   const isHome=m.home_id===t.id;
   const opp=T(isHome?m.away_id:m.home_id);
   return {week:m.week,opp,isHome};
  });
  return {team:t,rem,items};
 });
}

async function addPenalty(e){
 e.preventDefault();
 const f=e.target;
 const team_id=+f.team_id.value;
 const pts=Number(f.pts.value)||0;
 const reason=f.reason.value.trim();

 if(!team_id||!reason)return false;
 const list=getPenalties();
 const now=new Date().toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
 list.push({id:Date.now(),team_id,pts,reason,sanction,date:now});
 await act(()=>api('PUT','/api/admin/settings',{penalties:JSON.stringify(list)}),pts<0?'Ceza puanı işlendi':pts>0?'Ödül puanı eklendi':'Disiplin kaydı eklendi');
 return false;
}

function h2hSection(){

 if(!h2hB||!S.teams.some(t=>t.id===h2hB)||h2hB===h2hA)h2hB=(S.teams.find(t=>t.id!==h2hA)||S.teams[1]).id;

 const duos=S.matches.filter(m=>m.played&&((m.home_id===h2hA&&m.away_id===h2hB)||(m.home_id===h2hB&&m.away_id===h2hA)));
 let wA=0,wB=0,dr=0,gA=0,gB=0;
 duos.forEach(m=>{

 });

    <div class="mut">${duos.length?`${duos.length} maç (G - B - G)`:'Henüz karşılaşmadılar'}</div>
   </div>

 </div>`;
}

let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;render()});
async function installApp(){if(!deferredInstall)return;deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;render()}

function launchConfetti(){
  if(getPlayoffCfg().no_confetti)return;
  const cols=['#22c55e','#facc15','#38bdf8','#f43f5e','#a855f7','#fb923c'];
  for(let i=0;i<42;i++){
    const el=document.createElement('div');
    el.className='confetti-p';
    el.style.left=(Math.random()*100)+'vw';
    el.style.background=cols[i%cols.length];
    el.style.animationDelay=(Math.random()*0.45)+'s';
    el.style.animationDuration=(2.1+Math.random()*1.1)+'s';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),3600);
  }
}

function setNick(val){
  const n=(val!==undefined?val:prompt('Tahmin sıralamasında görünecek adın / rumuzun:',MY_NICK||'')).trim().slice(0,24);
  if(!n)return false;
  MY_NICK=n;
  try{localStorage.setItem(NICK_KEY,MY_NICK)}catch{}
  render();
  return true;
}

function allPredictions(){
  let srvPreds={};
  try{srvPreds=JSON.parse(S.settings.predictions||'{}')||{}}catch{srvPreds={}}
  return srvPreds;
}

function matchOutcome(m){
  if(!m.played)return '';
  if(m.hs>m.aws)return 'H';
  if(m.hs<m.aws)return 'A';
  return 'D';
}

async function votePick(mid,pick){
  const m=S.matches.find(x=>x.id===mid);
  if(!m||m.played)return;
  if(!MY_NICK && !setNick())return;
  const k=String(mid);
  const preds=allPredictions();
  const cur=(preds[k]&&preds[k][MY_NICK])||VOTES[k]||'';
  const next=cur===pick?'':pick;
  if(next)VOTES[k]=next; else delete VOTES[k];
  try{localStorage.setItem(VOTES_KEY,JSON.stringify(VOTES))}catch{}
  if(!preds[k])preds[k]={};
  if(next)preds[k][MY_NICK]=next; else delete preds[k][MY_NICK];
  S.settings.predictions=JSON.stringify(preds);
  render();
  try{
    const r=await api('POST','/api/predictions',{match_id:mid,user:MY_NICK,pick:next});
    if(r&&r.predictions)S.settings.predictions=JSON.stringify(r.predictions);
    render();
  }catch(e){toast(e.message||'Oy kaydedilemedi',1)}
}

function predBar(m){
  const k=String(m.id);
  const preds=allPredictions();
  const map=preds[k]||{};
  const my=(MY_NICK&&map[MY_NICK])||VOTES[k]||'';
  if(m.played){
    if(!my)return '';
    const out=matchOutcome(m);
    return '<div class="pred-box">'+(my===out
      ?'<div class="pred-res ok">✅ Tahminin Tuttu! (+3 Puan)</div>'
      :'<div class="pred-res no">❌ Tahminin Yattı</div>')+'</div>';
  }
  const entries=Object.entries(map);
  let cH=0,cD=0,cA=0;
  for(const [,v] of entries){if(v==='H')cH++;else if(v==='D')cD++;else if(v==='A')cA++;}
  if(my && !entries.some(([u])=>u===MY_NICK)){
    if(my==='H')cH++;else if(my==='D')cD++;else if(my==='A')cA++;
  }
  const tot=cH+cD+cA;
  const rH=tot?Math.round(cH*100/tot):0;
  const rD=tot?Math.round(cD*100/tot):0;
  const rA=tot?Math.max(0,100-rH-rD):0;
  const h=T(m.home_id),a=T(m.away_id);
  const statusHtml='<div class="mut" style="text-align:center;font-size:11px;margin-top:5px">'+(tot?tot+' kişi oy verdi':'İlk tahmini sen yap!')+(MY_NICK?' · 👤 '+esc(MY_NICK):'')+'</div>';
  return '<div class="pred-box"><div class="pred-row">'
    +'<button type="button" class="xs pred-btn '+(my==='H'?'pri picked':'')+'" onclick="votePick('+m.id+',\'H\')">'+esc(h.short||h.name)+' '+(tot?'(%'+rH+')':'')+'</button>'
    +'<button type="button" class="xs pred-btn '+(my==='D'?'pri picked':'')+'" onclick="votePick('+m.id+',\'D\')">Berabere '+(tot?'(%'+rD+')':'')+'</button>'
    +'<button type="button" class="xs pred-btn '+(my==='A'?'pri picked':'')+'" onclick="votePick('+m.id+',\'A\')">'+esc(a.short||a.name)+' '+(tot?'(%'+rA+')':'')+'</button>'
    +'</div>'+statusHtml+'</div>';
}

function predictionLeaderboard(){
  if(getPlayoffCfg().hide_pred_board)return '';
  const preds=allPredictions();
  const scores={};
  for(const m of S.matches){
    if(!m.played)continue;
    const out=matchOutcome(m);
    const map=preds[String(m.id)]||{};
    for(const [user,pick] of Object.entries(map)){
      if(!scores[user])scores[user]={user,pts:0,hit:0,tot:0};
      scores[user].tot++;
      if(pick===out){scores[user].hit++;scores[user].pts+=3;}
    }
  }
  const rows=Object.values(scores).sort((a,b)=>b.pts-a.pts||b.hit-a.hit||a.tot-b.tot);
  const nickStrip='<div class="nick-bar"><span>🎯 <b>1v1 Tahmin Oyunu</b> '+(MY_NICK?'— Aktif Oyuncu: <b style="color:#4ade80">'+esc(MY_NICK)+'</b>':'— Oy vermek için rumuzunu seç')+'</span><button type="button" class="sm" onclick="setNick()">'+(MY_NICK?'✏️ İsmi Değiştir':'👤 İsim Gir')+'</button></div>';
  if(!rows.length){
    return '<div class="sh"><h2>🎯 Tahmin Kralı Sıralaması</h2></div><div class="card">'+nickStrip+'<div class="mut" style="font-size:13px">Henüz sonuçlanan maçlarda puan kazanan tahmin yok. Sıradaki maçlara oy ver, maçlar bittikçe doğru tahmin başına <b>+3 puan</b> kazan!</div></div>';
  }
  return '<div class="sh"><h2>🎯 Tahmin Kralı Sıralaması</h2></div><div class="card tw">'+nickStrip+'<table><thead><tr><th>#<th class="n">Tahminci<th>Oynanan<th>İsabet<th>Oran<th>Puan</tr></thead><tbody>'
    +rows.map((r,i)=>'<tr><td><span class="pos">'+(i+1)+'</span><td class="n"><b>'+(i===0?'👑 ':'')+esc(r.user)+'</b><td>'+r.tot+'<td>'+r.hit+'<td>%'+Math.round(r.hit*100/Math.max(1,r.tot))+'<td class="pts">'+r.pts+'</tr>').join('')
    +'</tbody></table></div>';
}

function getPlayoffCfg(){
  let cfg={};
  try{cfg=JSON.parse(S.settings.playoff_cfg||'{}')||{}}catch{cfg={}}
  return Object.assign({
    hidden:false,
    hide_news:false,
    hide_pred_board:false,
    no_confetti:false,
    mode:'auto',
    sf1_h:'',sf1_a:'',sf1_hs:'',sf1_aws:'',
    sf2_h:'',sf2_a:'',sf2_hs:'',sf2_aws:'',
    fin_h:'',fin_a:'',fin_hs:'',fin_aws:''
  },cfg);
}

function getCustomNews(){
  let arr=[];
  try{arr=JSON.parse(S.settings.custom_news||'[]')||[]}catch{arr=[]}
  return Array.isArray(arr)?arr:[];
}

function headlinesSection(){
  if(getPlayoffCfg().hide_news)return '';
  const pl=S.matches.filter(m=>m.played).sort((a,b)=>(b.updated||'').localeCompare(a.updated||'')||b.id-a.id);
  const st=liveStandings();
  const items=[];
  for(const cn of getCustomNews()){
    if(cn&&cn.title)items.push({k:esc(cn.kicker||'ÖZEL MANŞET'),t:esc(cn.title)});
  }
  if(st.rows.length>=2){
    const l1=st.rows[0],l2=st.rows[1];
    const gap=(l1.pts||0)-(l2.pts||0);
    items.push({k:'ZİRVE RAPORU',t:gap===0?esc(l1.name)+' ve '+esc(l2.name)+' zirvede puan puana çarpışıyor!':esc(l1.name)+', en yakın rakibi '+esc(l2.name)+' önünde '+gap+' puan farkla lider!'});
  }
  const blowout=[...pl].sort((a,b)=>Math.abs(b.hs-b.aws)-Math.abs(a.hs-a.aws))[0];
  if(blowout && Math.abs(blowout.hs-blowout.aws)>=3){
    const w=blowout.hs>blowout.aws?T(blowout.home_id):T(blowout.away_id);
    const l=blowout.hs>blowout.aws?T(blowout.away_id):T(blowout.home_id);
    items.push({k:'HAFTANIN ŞOVU · H'+blowout.week,t:'TARİHİ TARİFE! '+esc(w.name)+', '+esc(l.name)+' karşısında sahayı dar etti ('+blowout.hs+'-'+blowout.aws+')!'});
  }
  const latest=pl[0];
  if(latest && latest!==blowout){
    const h=T(latest.home_id),a=T(latest.away_id);
    if(latest.hs===latest.aws){
      items.push({k:'SON DÜDÜK · H'+latest.week,t:'NEFES KESEN DÜELLO: '+esc(h.name)+' ile '+esc(a.name)+' yenişemedi ('+latest.hs+'-'+latest.aws+').'});
    }else{
      const w=latest.hs>latest.aws?h:a;
      items.push({k:'SON MAÇ MANŞETİ · H'+latest.week,t:esc(w.name)+' kritik virajı kayıpsız geçti ('+latest.hs+'-'+latest.aws+')!'});
    }
  }
  if(!items.length)return '';
  return '<div class="sh"><h2>📰 Spor Gazetesi Manşetleri</h2></div><div class="news-ticker">'
    +items.slice(0,4).map(x=>'<div class="news-item"><div class="news-kicker">'+x.k+'</div><div class="news-title">'+x.t+'</div></div>').join('')
    +'</div>';
}

function playoffSection(){
  const cfg=getPlayoffCfg();
  if(cfg.hidden)return '';
  const st=liveStandings();
  if(cfg.mode==='manual'){
    const renderSlot=(idVal,label,scVal)=>{
      const tm=idVal?T(Number(idVal)):null;
      const sc=(scVal!==''&&scVal!==null&&scVal!==undefined)?esc(String(scVal)):'-';
      if(tm&&tm.id)return '<div class="po-team"><span>'+badgePure(tm,22)+' <b>'+esc(tm.name)+'</b></span><b>'+sc+'</b></div>';
      return '<div class="po-team"><span class="mut">'+esc(label)+'</span><b>'+sc+'</b></div>';
    };
    return '<div class="sh"><h2>🏆 Kupa / Play-Off Ağacı</h2><span class="tag">Yönetici Özel Eşleşmesi</span></div>'
      +'<div class="card"><div class="po-grid">'
      +'<div class="po-col">'
      +'<div class="po-match"><div class="mut" style="font-size:11px;font-weight:800">YARI FİNAL 1</div>'
      +renderSlot(cfg.sf1_h,'Belirlenmedi',cfg.sf1_hs)
      +renderSlot(cfg.sf1_a,'Belirlenmedi',cfg.sf1_aws)+'</div>'
      +'<div class="po-match"><div class="mut" style="font-size:11px;font-weight:800">YARI FİNAL 2</div>'
      +renderSlot(cfg.sf2_h,'Belirlenmedi',cfg.sf2_hs)
      +renderSlot(cfg.sf2_a,'Belirlenmedi',cfg.sf2_aws)+'</div>'
      +'</div>'
      +'<div class="po-col"><div class="po-match po-final"><div style="font-size:11px;font-weight:900;color:#facc15">🏆 BÜYÜK FİNAL</div>'
      +renderSlot(cfg.fin_h,'Yarı Final 1 Galibi',cfg.fin_hs)
      +renderSlot(cfg.fin_a,'Yarı Final 2 Galibi',cfg.fin_aws)
      +'</div></div>'
      +'</div></div>';
  }
  if(st.rows.length<4)return '';
  const top4=st.rows.slice(0,4);
  const t1=top4[0],t2=top4[1],t3=top4[2],t4=top4[3];
  const findLatest=(idA,idB)=>S.matches.filter(m=>m.played&&((m.home_id===idA&&m.away_id===idB)||(m.home_id===idB&&m.away_id===idA))).sort((a,b)=>b.id-a.id)[0];
  const sf1=findLatest(t1.id,t4.id);
  const sf2=findLatest(t2.id,t3.id);
  const scOf=(m,tid)=>!m?'-':(m.home_id===tid?m.hs:m.aws);
  return '<div class="sh"><h2>🏆 Kupa / Play-Off Ağacı (İlk 4)</h2><span class="mut">Canlı sıralamaya göre otomatik eşleşme</span></div>'
    +'<div class="card"><div class="po-grid">'
    +'<div class="po-col">'
    +'<div class="po-match"><div class="mut" style="font-size:11px;font-weight:800">YARI FİNAL 1 (1. vs 4.)</div>'
    +'<div class="po-team"><span>'+badgePure(t1,22)+' <b>1. '+esc(t1.name)+'</b></span><b>'+scOf(sf1,t1.id)+'</b></div>'
    +'<div class="po-team"><span>'+badgePure(t4,22)+' <b>4. '+esc(t4.name)+'</b></span><b>'+scOf(sf1,t4.id)+'</b></div></div>'
    +'<div class="po-match"><div class="mut" style="font-size:11px;font-weight:800">YARI FİNAL 2 (2. vs 3.)</div>'
    +'<div class="po-team"><span>'+badgePure(t2,22)+' <b>2. '+esc(t2.name)+'</b></span><b>'+scOf(sf2,t2.id)+'</b></div>'
    +'<div class="po-team"><span>'+badgePure(t3,22)+' <b>3. '+esc(t3.name)+'</b></span><b>'+scOf(sf2,t3.id)+'</b></div></div>'
    +'</div>'
    +'<div class="po-col"><div class="po-match po-final"><div style="font-size:11px;font-weight:900;color:#facc15">🏆 BÜYÜK FİNAL</div>'
    +'<div class="po-team"><span>Yarı Final 1 Galibi</span><span class="tag">Finalist</span></div>'
    +'<div class="po-team"><span>Yarı Final 2 Galibi</span><span class="tag">Finalist</span></div>'
    +'<div class="mut" style="font-size:11px;margin-top:8px">Lig sıralaması değiştikçe eşleşmeler otomatik güncellenir.</div></div></div>'
    +'</div></div>';
}

async function saveAdminExtra(key,obj){
  try{
    const val=JSON.stringify(obj);
    await api('POST','/api/admin/extras',{key,value:val});
    S.settings[key]=val;
    toast('Kaydedildi');
    render();
  }catch(e){toast(e.message||'Kaydedilemedi',1)}
}

function savePlayoffForm(){
  const g=id=>document.getElementById(id)?.value??'';
  const cfg={
    hidden:!document.getElementById('po_show_po')?.checked,
    hide_news:!document.getElementById('po_show_news')?.checked,
    hide_pred_board:!document.getElementById('po_show_pred')?.checked,
    no_confetti:!document.getElementById('po_show_conf')?.checked,
    mode:g('po_mode')||'auto',
    sf1_h:g('po_sf1_h'),sf1_a:g('po_sf1_a'),sf1_hs:g('po_sf1_hs'),sf1_aws:g('po_sf1_aws'),
    sf2_h:g('po_sf2_h'),sf2_a:g('po_sf2_a'),sf2_hs:g('po_sf2_hs'),sf2_aws:g('po_sf2_aws'),
    fin_h:g('po_fin_h'),fin_a:g('po_fin_a'),fin_hs:g('po_fin_hs'),fin_aws:g('po_fin_aws')
  };
  saveAdminExtra('playoff_cfg',cfg);
}

function addCustomHeadline(){
  const k=(document.getElementById('cn_kicker')?.value||'ÖZEL MANŞET').trim().slice(0,30);
  const t=(document.getElementById('cn_title')?.value||'').trim().slice(0,140);
  if(!t)return toast('Manşet metni yaz',1);
  const list=getCustomNews();
  list.unshift({id:Date.now(),kicker:k||'ÖZEL MANŞET',title:t});
  saveAdminExtra('custom_news',list);
}

function delCustomHeadline(idx){
  const list=getCustomNews();
  list.splice(idx,1);
  saveAdminExtra('custom_news',list);
}

function delPredictorUser(uname){
  if(!uname)return;
  if(!confirm(uname+' kullanıcısının tüm tahminleri silinsin mi?'))return;
  const preds=allPredictions();
  for(const mid of Object.keys(preds)){
    if(preds[mid]&&typeof preds[mid]==='object')delete preds[mid][uname];
  }
  saveAdminExtra('predictions',preds);
}

function resetAllPredictions(){
  if(!confirm('Tüm tahminler ve Tahmin Kralı puanları sıfırlansın mı?'))return;
  saveAdminExtra('predictions',{});
}

function fitText(ctx,t,m){let s=String(t??'');if(ctx.measureText(s).width<=m)return s;while(s.length>1&&ctx.measureText(s+'…').width>m)s=s.slice(0,-1);return s+'…'}
function drawBadge(ctx,tm,cx,cy,rad){const bg=tm.color||"#22c55e",h=bg.replace("#","");const r=parseInt(h.slice(0,2),16)||34,g=parseInt(h.slice(2,4),16)||197,b=parseInt(h.slice(4,6),16)||94;const fg=(r*299+g*587+b*114)/1000>150?"#08101f":"#ffffff";ctx.save();ctx.beginPath();ctx.arc(cx,cy,rad,0,Math.PI*2);ctx.fillStyle=bg;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle="rgba(255,255,255,.22)";ctx.stroke();ctx.fillStyle=fg;ctx.font=`800 ${Math.round(rad*.72)}px system-ui,Segoe UI,sans-serif`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(String(tm.short||tm.name.slice(0,3)).toUpperCase(),cx,cy+2);ctx.restore()}

function genStrongPass(len=12){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%';
  let out='';
  for(let i=0;i<len;i++) out+=chars[Math.floor(Math.random()*chars.length)];
  const inp=document.getElementById('newAdmPass');
  if(inp){ inp.value=out; inp.type='text'; }
  if(navigator.clipboard) navigator.clipboard.writeText(out).catch(()=>{});
  toast('Güçlü şifre oluşturuldu ve kopyalandı!');
}
async function enableAdminDevicePush(enable){
  try {
    if(!enable){
      await act(async()=>{
        await api('POST','/api/admin/push-notify',{enabled:false});
        await loadAdminUsersData();
        alert('ℹ️ Yönetici cihaz bildirimi kapatıldı.');
      });
      return;
    }
    if(!('Notification' in window) || !('serviceWorker' in navigator)){
      alert('Bu tarayıcı anlık bildirimleri desteklemiyor. Ana ekrana ekleyip tekrar deneyin.');
      return;
    }
    const perm = await Notification.requestPermission();
    if(perm !== 'granted'){
      alert('Bildirim izni verilmedi. Tarayıcı ayarlarından bildirimlere izin verin.');
      return;
    }
    await navigator.serviceWorker.register('/sw.js');
    const reg = await navigator.serviceWorker.ready;
    const vk = await api('GET','/api/push/key');
    const pubKey = vk && (vk.publicKey || vk.key);
    if(!pubKey){ alert('Sunucu bildirim anahtarı bulunamadı.'); return; }
    const pad = '='.repeat((4 - pubKey.length % 4) % 4);
    const b64 = (pubKey + pad).replace(/-/g,'+').replace(/_/g,'/');
    const raw = atob(b64);
    const arr = new Uint8Array(raw.length);
    for(let i=0;i<raw.length;i++) arr[i]=raw.charCodeAt(i);
    let sub = await reg.pushManager.getSubscription();
    if(!sub) sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:arr});
    await act(async()=>{
      await api('POST','/api/admin/push-notify',{enabled:true, sub:sub.toJSON()});
      await loadAdminUsersData();
      alert('✅ Harika! Artık başka bir yönetici giriş yaptığında veya değişiklik yaptığında doğrudan bu cihaza bildirim gelecek.');
    });
  } catch(err) {
    alert('Bildirim açılırken hata: ' + (err.message || err));
  }
}

window._krdLiveCache = null;
window.getLiveMatches = function(){
  try{
    const raw = (S && S.settings && S.settings.live_matches !== undefined) ? S.settings.live_matches : window._krdLiveCache;
    if(!raw) return Array.isArray(window._krdLiveCache) ? window._krdLiveCache : [];
    const arr = typeof raw === 'string' ? JSON.parse(raw) : raw;
    if(Array.isArray(arr)){ window._krdLiveCache = arr; return arr; }
    return [];
  }catch{ return Array.isArray(window._krdLiveCache) ? window._krdLiveCache : []; }
};
window.pushLiveList = async function(list, msg){
  try{
    window._krdLiveCache = list;
    if(S && S.settings) S.settings.live_matches = JSON.stringify(list);
    render();
    if(typeof renderPublicLiveBar === 'function') renderPublicLiveBar();
    const res = await api('POST', '/api/admin/live-matches', { live: list });
    const finalList = (res && Array.isArray(res.live)) ? res.live : list;
    window._krdLiveCache = finalList;
    if(S && S.settings) S.settings.live_matches = JSON.stringify(finalList);
    render();
    if(typeof renderPublicLiveBar === 'function') renderPublicLiveBar();
    if(msg && typeof toast === 'function') toast(msg);
  }catch(err){
    alert('Canlı Maç Hatası: ' + (err && err.message ? err.message : err));
  }
};
window.addMatchToLive = async function(mid){
  mid = Number(mid);
  if(!mid) return alert('Lütfen listeden bir maç seç.');
  const list = [...window.getLiveMatches()];
  if(list.some(x => Number(x.id) === mid)) return typeof toast === 'function' ? toast('Bu maç zaten canlıda') : null;
  if(list.length >= 4) return alert('Aynı anda en fazla 4 maç canlı olabilir!');
  list.push({ id: mid, hs: 0, aws: 0 });
  await window.pushLiveList(list, 'Maç canlı yayına alındı!');
};
window.updateLiveMatch = async function(mid, dHs, dAws){
  mid = Number(mid);
  const list = window.getLiveMatches().map(x => {
    if(Number(x.id) !== mid) return x;
    return {
      id: mid,
      hs: Math.max(0, (Number(x.hs) || 0) + Number(dHs || 0)),
      aws: Math.max(0, (Number(x.aws) || 0) + Number(dAws || 0))
    };
  });
  await window.pushLiveList(list, 'Canlı skor güncellendi');
};
window.removeLiveMatch = async function(mid, saveToTable){
  mid = Number(mid);
  const list = window.getLiveMatches();
  const item = list.find(x => Number(x.id) === mid);
  const rest = list.filter(x => Number(x.id) !== mid);
  try{
    if(saveToTable && item){
      await api('PUT', '/api/admin/matches/' + mid, { hs: Number(item.hs)||0, aws: Number(item.aws)||0, played: 1 });
      await load();
    }
    await window.pushLiveList(rest, saveToTable ? 'Maç bitirildi ve tabloya işlendi!' : 'Canlı listeden çıkarıldı');
  }catch(err){
    alert('İşlem Hatası: ' + (err && err.message ? err.message : err));
  }
};

function restoreJson(inp){
 const file=inp.files?.[0];if(!file)return;
 const rd=new FileReader();
 rd.onload=()=>{
  try{
   const data=JSON.parse(rd.result);
   if(!confirm('Mevcut tüm lig verileri silinip yedek dosyasındaki veriler yüklenecek. Emin misin?')){inp.value='';return}
   act(()=>api('POST','/api/admin/restore',data),'Yedek başarıyla geri yüklendi');
  }catch{toast('Geçersiz JSON dosyası',1)}
  inp.value='';
 };
 rd.readAsText(file);
}

function render(){
  const _prevY = window.scrollY || document.documentElement.scrollTop || 0;
  const _ae = document.activeElement;
  const _aeId = (_ae && _ae.id) ? _ae.id : '';
  const _aeName = (_ae && _ae.name) ? _ae.name : '';
  const _aeVal = (_ae && typeof _ae.value === 'string') ? _ae.value : null;
  const _selStart = (_ae && typeof _ae.selectionStart === 'number') ? _ae.selectionStart : null;

  const _admSlug=(S&&S.settings&&S.settings.admin_slug)||'krd-kontrol';
  const r=location.hash.startsWith('#/'+_admSlug)||location.hash.startsWith('#/yonetici-gizli');
  $('#app').innerHTML=!r?home():!ME.admin?login():panel();
  bump=null;

  const _canExtras = !ME || ME.isPrimary !== false || (Array.isArray(ME.perms) && ME.perms.includes('kupa'));
  const _swBar = document.getElementById('krdAdmSwitchBar');
  if (_swBar) _swBar.style.display = _canExtras ? '' : 'none';

  // Kaydirma konumunu ve aktif input odagini geri yukle (sayfa yukari kaymaz)
  requestAnimationFrame(() => {
    window.scrollTo(0, _prevY);
    if (_aeId || _aeName) {
      const _nextEl = _aeId ? document.getElementById(_aeId) : document.querySelector('[name="' + _aeName + '"]');
      if (_nextEl && document.body.contains(_nextEl)) {
        try {
          _nextEl.focus({ preventScroll: true });
          if (_aeVal !== null && _nextEl.value !== _aeVal) _nextEl.value = _aeVal;
          if (_selStart !== null && typeof _nextEl.setSelectionRange === 'function') {
            _nextEl.setSelectionRange(_selStart, _selStart);
          }
        } catch {}
      }
    }
  });
}

<button id="krdPushBtn" class="krd-push-btn" title="Bildirimleri Aç" aria-label="Bildirimler" style="position:fixed;left:14px;top:14px;right:auto;bottom:auto;width:42px;height:42px;padding:0;border-radius:50%;justify-content:center;font-size:18px;z-index:9995;">🔔</button>

<script>
(function() {
  // --- 1. CANLI WEB PUSH ABONELIGI ---
  function urlBase64ToUint8Array(base64String) {
    const padding = '='.repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    const rawData = atob(base64);
    const outputArray = new Uint8Array(rawData.length);
    for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
    return outputArray;
  }

  const pushBtn = document.getElementById('krdPushBtn');
  async function updatePushBtnState() {
    if (!pushBtn) return;
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
      pushBtn.style.display = 'none';
      return;
    }
    const savedOn = localStorage.getItem('krd_live_notify') === '1' || localStorage.getItem('krd_push_subscribed') === '1';
    if (Notification.permission === 'granted' && savedOn) {
      pushBtn.innerHTML = '🔔<span style="position:absolute;top:2px;right:2px;width:9px;height:9px;background:#22c55e;border-radius:50%;border:1.5px solid #0f172a;"></span>';
      pushBtn.title = 'Bildirimler Açık';
      pushBtn.classList.add('subscribed');
    }
    try {
      if (Notification.permission === 'granted') {
        const reg = await navigator.serviceWorker.getRegistration();
        const sub = reg ? await reg.pushManager.getSubscription() : null;
        if (sub) {
          localStorage.setItem('krd_push_subscribed', '1');
          pushBtn.innerHTML = '🔔<span style="position:absolute;top:2px;right:2px;width:9px;height:9px;background:#22c55e;border-radius:50%;border:1.5px solid #0f172a;"></span>';
          pushBtn.title = 'Bildirimler Açık';
          pushBtn.classList.add('subscribed');
        }
      }
    } catch {}
  }

  async function subscribePush() {
    try {
      const perm = await Notification.requestPermission();
      if (perm !== 'granted') {
        alert('Bildirim izni verilmedi. Tarayıcı veya telefon ayarlarından KRD Ligi bildirimlerine izin verebilirsin.');
        return;
      }
      if ('serviceWorker' in navigator) {
        await navigator.serviceWorker.register('/sw.js');
      }
      const reg = await navigator.serviceWorker.ready;
      const keyRes = await fetch('/api/push/key');
      const { publicKey } = await keyRes.json();
      if (!publicKey) return;
      let sub = await reg.pushManager.getSubscription();
      if (!sub) {
        sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(publicKey)
        });
      }
      const saveRes = await fetch('/api/push/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-kl': '1' },
        body: JSON.stringify({ subscription: sub })
      });
      if (!saveRes.ok) throw new Error('Sunucu abonelik kaydı başarısız (' + saveRes.status + ')');
      localStorage.setItem('krd_push_subscribed', '1');
      updatePushBtnState();
      alert('Harika! Artık maç skoru girildiğinde veya yeni manşet yayınlandığında telefonuna anında bildirim düşecek.');
    } catch (err) {
      const msg = String(err && err.message ? err.message : err);
      if (/storage error|push service error|AbortError/i.test(msg)) {
        localStorage.setItem('krd_live_notify', '1');
        if (pushBtn) {
          updatePushBtnState();
          pushBtn.classList.add('subscribed');
        }
        try {
          const reg = await navigator.serviceWorker.ready;
          if (reg && reg.showNotification) {
            await reg.showNotification('⚽ KRD Ligi Bildirimleri Açıldı', {
              body: 'Maç skorları ve yönetici duyuruları bildirim olarak düşecek.',
              icon: '/icon-192.png',
              tag: 'krd-ligi-genel'
            });
          }
        } catch {}
        return;
      }
      console.error('Push abonelik hatasi:', err);
      alert('Bildirim hatası: ' + msg);
    }
  }

  
  if (pushBtn) {
    pushBtn.addEventListener('click', subscribePush);
    updatePushBtnState();
  }

  // --- 2. KISISEL ISTATISTIK KARTLARI ---
  const modal = document.getElementById('krdTeamStatsModal');
  const modalBody = document.getElementById('krdTeamStatsBody');
  if (modal) {
    modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('open'); });
  }

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  async function openTeamCard(teamName) { return;
    try {
      const res = await fetch('/api/league');
      const data = await res.json();
      const teams = data.teams || [];
      const matches = (data.matches || []).filter(m => m.played);
      const table = data.table || [];
      const row = table.find(t => t.name.toLowerCase() === teamName.toLowerCase());
      const team = teams.find(t => t.name.toLowerCase() === teamName.toLowerCase()) || row;
      if (!team || !row) return;

      const teamMap = Object.fromEntries(teams.map(t => [t.id, t.name]));
      const myMatches = matches
        .filter(m => m.home_id === team.id || m.away_id === team.id)
        .sort((a, b) => (a.week - b.week) || (a.id - b.id));

      let curWinStreak = 0, maxWinStreak = 0, unbeatenStreak = 0, maxUnbeaten = 0;
      let bestWin = null;
      const form = [];

      for (const m of myMatches) {
        const isHome = m.home_id === team.id;
        const gf = isHome ? m.hs : m.aws;
        const ga = isHome ? m.aws : m.hs;
        const opp = teamMap[isHome ? m.away_id : m.home_id] || 'Rakip';
        const diff = gf - ga;

        if (diff > 0) {
          form.push('G');
          curWinStreak++;
          unbeatenStreak++;
          if (curWinStreak > maxWinStreak) maxWinStreak = curWinStreak;
          if (unbeatenStreak > maxUnbeaten) maxUnbeaten = unbeatenStreak;
          if (!bestWin || diff > bestWin.diff || (diff === bestWin.diff && gf > bestWin.gf)) {
            bestWin = { diff, gf, ga, opp, score: `${gf}-${ga}` };
          }
        } else if (diff === 0) {
          form.push('B');
          curWinStreak = 0;
          unbeatenStreak++;
          if (unbeatenStreak > maxUnbeaten) maxUnbeaten = unbeatenStreak;
        } else {
          form.push('M');
          curWinStreak = 0;
          unbeatenStreak = 0;
        }
      }

      const avgGf = row.p ? (row.gf / row.p).toFixed(2) : '0.00';
      const avgGa = row.p ? (row.ga / row.p).toFixed(2) : '0.00';
      const winRate = row.p ? Math.round((row.w / row.p) * 100) : 0;
      const rank = table.findIndex(t => t.id === team.id) + 1;
      const last5 = form.slice(-5);

      modalBody.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
          <div style="display:flex;align-items:center;gap:10px;">
            <span style="width:14px;height:36px;border-radius:6px;background:${esc(team.color || '#22c55e')};display:inline-block;"></span>
            <div>
              <div style="font-size:19px;font-weight:800;line-height:1.2;">${esc(team.name)}</div>
              <div style="font-size:12px;color:#94a3b8;">Lig Sırası: #${rank} • ${row.pts} Puan (${row.p} Maç)</div>
            </div>
          </div>
          <button type="button" id="krdCloseStatBtn" style="background:#1e293b;border:none;color:#cbd5e1;width:32px;height:32px;border-radius:10px;font-size:16px;cursor:pointer;">✕</button>
        </div>

        <div class="krd-stat-grid">
          <div class="krd-stat-box">
            <div class="krd-stat-lbl">Galibiyet Serisi</div>
            <div class="krd-stat-val">${curWinStreak} Maç</div>
            <div class="krd-stat-sub">Rekor Seri: ${maxWinStreak} Maç</div>
          </div>
          <div class="krd-stat-box">
            <div class="krd-stat-lbl">Maç Başı Gol Ort.</div>
            <div class="krd-stat-val">${avgGf}</div>
            <div class="krd-stat-sub">Yenen Ort: ${avgGa} / maç</div>
          </div>
          <div class="krd-stat-box">
            <div class="krd-stat-lbl">En Farklı Galibiyet</div>
            <div class="krd-stat-val">${bestWin ? bestWin.score : '—'}</div>
            <div class="krd-stat-sub">${bestWin ? esc(bestWin.opp) + ' karşısında' : 'Henüz galibiyet yok'}</div>
          </div>
          <div class="krd-stat-box">
            <div class="krd-stat-lbl">Kazanma & Yenilmezlik</div>
            <div class="krd-stat-val">%${winRate}</div>
            <div class="krd-stat-sub">En Uzun Yenilmezlik: ${maxUnbeaten}</div>
          </div>
        </div>

        <div style="margin-top:14px;background:rgba(30,41,59,0.55);border-radius:12px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;">
          <span style="font-size:12px;color:#94a3b8;font-weight:600;">Son 5 Maç Formu</span>
          <div>${last5.length ? last5.map(r => `<span class="krd-form-pill krd-form-${r}">${r}</span>`).join('') : '<span style="font-size:12px;color:#64748b;">Maç yok</span>'}</div>
        </div>
      `;
      document.getElementById('krdCloseStatBtn').onclick = () => modal.classList.remove('open');
      modal.classList.add('open');
    } catch (e) {
      console.error('Istatistik karti hatasi:', e);
    }
  }

  // Tablodaki takim isimlerine tiklaninca istatistik kartini ac
  document.addEventListener('click', e => {
    const cell = e.target.closest('td, .team-name, [data-team]');
    if (!cell) return;
    const tableEl = cell.closest('table');
    if (!tableEl) return;
    const row = cell.closest('tr');
    if (!row || row.parentElement.tagName === 'THEAD') return;
    // Takim adi sutunu genelde 2. sutundur (index 1)
    const cells = Array.from(row.children);
    const idx = cells.indexOf(cell);
    if (idx === 1 || cell.hasAttribute('data-team')) {
      const rawText = cell.getAttribute('data-team') || cell.textContent || '';
      const cleanName = rawText.replace(/^[0-9]+s*/, '').replace(/([^)]*)/g, '').trim();
      if (cleanName && cleanName.length >= 2) {
        openTeamCard(cleanName);
      }
    }
  });

  // Tablo satirlarina tiklanabilir imlec ekle
  setInterval(() => {
    document.querySelectorAll('table tbody tr').forEach(tr => {
      if (tr.children[1] && !tr.children[1].dataset.krdBound) {
        tr.children[1].dataset.krdBound = '1';
        tr.children[1].style.cursor = 'pointer';
        tr.children[1].title = 'Kişisel istatistik kartını görmek için tıkla';
      }
    });
  }, 1200);
})();
</script>

<script>
(function() {
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let cid = localStorage.getItem('krd_chat_cid');
  if (!cid) { cid = 'u_' + Math.random().toString(36).slice(2, 10); localStorage.setItem('krd_chat_cid', cid); }
  let myName = localStorage.getItem('krd_chat_name') || '';
  let isAdminChat = false;
  let lastMsgCount = 0;

  fetch('/api/me').then(r => r.json()).then(d => { isAdminChat = !!d.admin; }).catch(() => {});

  // Sag alt buton grubuna Sohbet balonunu ekle
  const pushBtn = document.getElementById('krdPushBtn');
  const fab = document.createElement('button');
  fab.id = 'krdChatFab';
  fab.type = 'button';
  fab.innerHTML = '<span class="krd-online-dot"></span> 💬 Sohbet (<span id="krdFabCount">1</span>)';
  const tickerEl = document.getElementById('krdLiveTickerBar') || document.querySelector('.ticker');
  let topChatStrip = document.getElementById('krdTopQuickBar');
  if (!topChatStrip && tickerEl && tickerEl.parentElement) {
    topChatStrip = document.createElement('div');
    topChatStrip.id = 'krdTopQuickBar';
    topChatStrip.innerHTML = '<span style="font-weight:700;color:#94a3b8">⚽ Canlı Lig Sohbeti</span>';
    tickerEl.parentElement.insertBefore(topChatStrip, tickerEl);
  }
  if (topChatStrip) {
    topChatStrip.appendChild(fab);
  } else if (pushBtn && pushBtn.parentElement) {
    pushBtn.parentElement.insertBefore(fab, pushBtn);
  } else {
    fab.style.cssText = 'position:fixed;right:14px;bottom:16px;z-index:9990;';
    document.body.appendChild(fab);
  }

  const box = document.getElementById('krdChatBox');
  const msgsEl = document.getElementById('krdChatMsgs');
  const onlineCountEl = document.getElementById('krdOnlineCount');
  const fabCountEl = document.getElementById('krdFabCount');
  const onlineNamesEl = document.getElementById('krdOnlineNames');

  function askName(force) {
    if (!force && myName) return true;
    const n = prompt('Sohbette görünecek ismin (örn: Yusuf, Mamutabi):', myName || '');
    if (n && n.trim()) {
      myName = n.trim().slice(0, 24);
      localStorage.setItem('krd_chat_name', myName);
      return true;
    }
    return false;
  }

  fab.addEventListener('click', () => {
    setTimeout(() => {
      const box = document.getElementById('krdChatBox') || document.getElementById('krdChatPanel');
      if (box) {
        const r = fab.getBoundingClientRect();
        box.style.setProperty('position', 'fixed', 'important');
        box.style.setProperty('top', Math.max(50, Math.round(r.bottom + 6)) + 'px', 'important');
        box.style.setProperty('bottom', 'auto', 'important');
        box.style.setProperty('left', '50%', 'important');
        box.style.setProperty('right', 'auto', 'important');
        box.style.setProperty('transform', 'translateX(-50%)', 'important');
      }
    }, 10);
    if (!box.classList.contains('open')) {
      if (!askName(false)) return;
      box.classList.add('open');
      syncChat(true);
    } else {
      box.classList.remove('open');
    }
  });

  document.getElementById('krdChatCloseBtn').onclick = () => box.classList.remove('open');
  document.getElementById('krdChangeNameBtn').onclick = () => { if (askName(true)) syncChat(false); };

  function renderMessages(messages, online) {
    const list = Array.isArray(online) && online.length ? online : (myName ? [myName] : ['Misafir']);
    onlineCountEl.textContent = list.length;
    fabCountEl.textContent = list.length;
    onlineNamesEl.innerHTML = list.map(n => `<span class="krd-online-pill">● ${esc(n)}</span>`).join('');

    const sig = JSON.stringify((messages || []).map(m => [m.id, m.text]));
    if (msgsEl.dataset.lastSig === sig) return;
    msgsEl.dataset.lastSig = sig;
    const wasBottom = msgsEl.scrollHeight - msgsEl.scrollTop - msgsEl.clientHeight < 80;
    msgsEl.innerHTML = (messages || []).map(m => {
      const isMe = (m.cid && m.cid === cid) || (!m.cid && myName && m.user.toLowerCase() === myName.toLowerCase());
      const canDel = isAdminChat || (m.cid && m.cid === cid);
      const t = m.time ? new Date(m.time).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }) : '';
            const delBtn = '';
            const banBtn = '';
      return `
        <div class="krd-msg ${isMe ? 'me' : 'other'}">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:2px;">
            <strong style="font-size:11px;color:${m.admin ? '#fbbf24' : '#38bdf8'};">${esc(m.user)}${m.admin ? ' 👑' : ''}</strong>
            <span style="font-size:10px;color:#94a3b8;">${t}</span>
          </div>
          <div>${esc(m.text)}</div>
        </div>
      `;
    }).join('') || '<div style="text-align:center;color:#64748b;font-size:12px;margin-top:40px;">Henüz mesaj yok. İlk mesajı sen yaz!</div>';

    if (wasBottom || (messages && messages.length !== lastMsgCount)) {
      msgsEl.scrollTop = msgsEl.scrollHeight;
    }
    lastMsgCount = messages ? messages.length : 0;
  }

  msgsEl.addEventListener('click', async e => {
    const banBtn = e.target.closest('[data-ban]');
    if (banBtn) {
      if (!confirm('Bu kullanıcı sohbetten engellensin ve mesajları silinsin mi?')) return;
      const r = await fetch('/api/chat/ban', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-kl': '1' },
        body: JSON.stringify({ msgId: banBtn.getAttribute('data-ban') })
      });
      if (r.ok && typeof toast === 'function') toast('Kullanıcı engellendi.');
      syncChat(false);
      return;
    }
    const btn = e.target.closest('[data-del]');
    if (!btn) return;
    if (!confirm('Bu mesaj silinsin mi?')) return;
    const r = await fetch('/api/chat/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-kl': '1' },
      body: JSON.stringify({ id: btn.getAttribute('data-del'), cid })
    });
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      alert(err.error || 'Sadece kendi mesajınızı silebilirsiniz.');
    }
    syncChat(false);
  });

  async function syncChat(scrollDown) {
    try {
      const q = `?cid=${encodeURIComponent(cid)}&name=${encodeURIComponent(myName || 'Ziyaretçi')}`;
      const r = await fetch('/api/chat' + q);
      if (!r.ok) return;
      const d = await r.json();
      const pinEl = document.getElementById('krdPinnedBar');
      if (pinEl) {
        if (d.pinned) { pinEl.style.display = 'block'; pinEl.textContent = '📌 Sabit: ' + d.pinned; }
        else { pinEl.style.display = 'none'; pinEl.textContent = ''; }
      }
      renderMessages(d.messages, d.online);
      if (scrollDown) msgsEl.scrollTop = msgsEl.scrollHeight;
    } catch {}
  }

  document.getElementById('krdChatForm').addEventListener('submit', async e => {
    e.preventDefault();
    e.stopImmediatePropagation();
    if (!askName(false)) return;
    const inp = document.getElementById('krdChatInput');
    const text = inp.value.trim();
    if (!text) return;
    inp.value = '';

    // 1. Sunucuyu beklemeden mesaji aninda sohbet kutusuna ekle (sifir bekleme/yenilenme)
    const emptyEl = msgsEl.querySelector('div[style*="Henüz mesaj yok"], div[style*="text-align:center"]');
    if (emptyEl && msgsEl.children.length === 1) emptyEl.remove();
    const nowStr = new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
    const tempDiv = document.createElement('div');
    tempDiv.className = 'krd-msg me';
    tempDiv.innerHTML =
      '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:2px;">' +
        '<strong style="font-size:11px;color:' + (isAdminChat ? '#fbbf24' : '#38bdf8') + ';">' + esc(myName) + (isAdminChat ? ' 👑' : '') + '</strong>' +
        '<span style="font-size:10px;color:#94a3b8;">' + nowStr + '</span>' +
      '</div>' +
      '<div>' + esc(text) + '</div>';
    msgsEl.appendChild(tempDiv);
    msgsEl.scrollTop = msgsEl.scrollHeight;

    // 2. Arka planda sunucuya kaydet, sayfa/kutu yenilenmeden sessizce esitle
    try {
      const r = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-kl': '1' },
        body: JSON.stringify({ user: myName, text, cid })
      });
      const d = await r.json().catch(() => ({}));
      if (r.ok && Array.isArray(d.messages)) {
        msgsEl.dataset.lastSig = JSON.stringify(d.messages.map(m => [m.id, m.text]));
      } else if (!r.ok) {
        tempDiv.remove();
        if (d.error) alert(d.error);
      }
    } catch {
      tempDiv.remove();
    }
  });

  // Sunucu SSE canli yayini geldiginde sohbeti aninda guncelle + 12 sn kalp atisi
  if (typeof EventSource !== 'undefined') {
    try {
      const es = new EventSource('/api/events');
      es.onmessage = () => { if (typeof syncChat === "function") syncChat(false); };
    } catch {}
  }
  syncChat(false);
  setInterval(() => syncChat(false), 12000);
})();
</script>


<script id="krdPro4Pack">
(function() {
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  window.calcFifaCard = function(teamId) {
    const tbl = (typeof S !== 'undefined' && S.table) ? S.table : [];
    const row = tbl.find(t => t.id === teamId) || { p:0, w:0, d:0, l:0, gf:0, ga:0, pts:0, name:'Oyuncu' };
    const winRate = row.p ? (row.w / row.p) : 0.5;
    const gfAvg = row.p ? (row.gf / row.p) : 1.5;
    const gaAvg = row.p ? (row.ga / row.p) : 1.5;

    const huc = Math.min(99, Math.max(76, Math.round(78 + gfAvg * 5.2)));
    const sav = Math.min(99, Math.max(75, Math.round(92 - gaAvg * 4.5)));
    const bit = Math.min(99, Math.max(76, Math.round(77 + winRate * 14 + gfAvg * 2.2)));
    const frm = Math.min(99, Math.max(75, Math.round(76 + winRate * 20)));
    const gen = Math.min(99, Math.max(78, Math.round(huc * 0.3 + sav * 0.25 + bit * 0.25 + frm * 0.2)));
    return { gen, huc, sav, bit, frm, row };
  };

  window.resetMatchScore = async function(id) {
    if (!confirm('Bu maçın skoru sıfırlanıp tekrar "Oynanmadı" durumuna alınsın mı?')) return;

          card.innerHTML = `

              <div>
                <div style="font-size:10px;letter-spacing:.08em;color:#facc15;font-weight:800;">eFOOTBALL / KRD KARTI</div>

              <div style="text-align:center;background:linear-gradient(135deg,#facc15,#eab308);color:#0f172a;padding:4px 11px;border-radius:10px;">

<script id="krdUxPolishJs">

        location.hash = '#/';

      }
    });

    document.getElementById('krdThemeBtn').addEventListener('click', () => {
      const idx = themes.findIndex(t => t.id === curTheme);
      const next = themes[(idx + 1) % themes.length];
      applyTheme(next.id);
    });

    applyTheme(curTheme);
  }

  function updateBackButtonState() {
    const btn = document.getElementById('krdBackBtn');
    if (!btn) return;
    const h = location.hash || '';
    const isSubPage = h.length > 2 && h !== '#/';
    if (isSubPage) btn.classList.remove('hidden');
    else btn.classList.add('hidden');
  }

  // 2. Fiksturde Hizli Takim Filtresi
  let activeTeamFilter = '';
  function injectTeamFilter() {
    if (typeof S === 'undefined' || !Array.isArray(S.teams) || !S.teams.length) return;
    const onAdmin = location.hash.startsWith('#/yonetici') || location.hash.startsWith('#/' + ((S.settings && S.settings.admin_slug) || 'krd-kontrol'));
    if (onAdmin) return;

    const grid = document.querySelector('#app .grid');
    if (!grid) return;

    let bar = document.getElementById('krdFilterBar');
    if (!bar) {
      bar = document.createElement('div');
      bar.id = 'krdFilterBar';
      grid.parentNode.insertBefore(bar, grid);
    }

    const expectedCount = S.teams.length + 1;
    if (bar.children.length !== expectedCount) {
      bar.innerHTML = `<button type="button" class="krd-chip ${!activeTeamFilter ? 'active' : ''}" data-team="">Tümü</button>` +
        S.teams.map(t => `<button type="button" class="krd-chip ${activeTeamFilter === t.name.toLowerCase() ? 'active' : ''}" data-team="${t.name.toLowerCase()}">${esc(t.name)}</button>`).join('');

      bar.querySelectorAll('.krd-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          activeTeamFilter = chip.getAttribute('data-team') || '';
          bar.querySelectorAll('.krd-chip').forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
          applyTeamFilterToCards();
        });
      });
    }
    applyTeamFilterToCards();
  }

  function applyTeamFilterToCards() {
    const grid = document.querySelector('#app .grid');
    if (!grid) return;
    Array.from(grid.children).forEach(card => {
      if (!activeTeamFilter) {
        card.style.display = '';
        return;
      }
      const txt = (card.textContent || '').toLowerCase();
      card.style.display = txt.includes(activeTeamFilter) ? '' : 'none';
    });
  }

  // 3. Yukari Cik Butonu
  function ensureScrollTopBtn() {
    if (document.getElementById('krdScrollTop')) return;
    const btn = document.createElement('button');
    btn.id = 'krdScrollTop';
    btn.type = 'button';
    btn.title = 'Yukarı Çık';
    btn.textContent = '↑';
    document.body.appendChild(btn);

    btn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
    window.addEventListener('scroll', () => {
      btn.style.display = window.scrollY > 260 ? 'flex' : 'none';
    }, { passive: true });
  }

  ensureTopNav();
  ensureScrollTopBtn();
  updateBackButtonState();
  window.addEventListener('hashchange', updateBackButtonState);
  setInterval(() => {
    updateBackButtonState();
    injectTeamFilter();
  }, 1000);
})();
</script>


<script id="krdMobileOverlapFixJs">

    let hasOpen = false;

      const st = window.getComputedStyle(m);
      if (st.display !== 'none' && st.visibility !== 'hidden' && m.offsetHeight > 40) {

  setInterval(syncModalState, 250);

<script id="krdCleanSuiteJs">
(function() {
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let tableMode = 'all';
  let lastTableSig = '';
  let fQuery = '', fWeek = '', fTeam = '';

  function isAdminView() {
    if (typeof S === 'undefined') return true;
    const slug = (S.settings && S.settings.admin_slug) ? S.settings.admin_slug : 'krd-kontrol';
    return location.hash.startsWith('#/yonetici') || location.hash.startsWith('#/' + slug);
  }

  function getLiveMap() {
    const list = typeof window.getLiveMatches === 'function' ? window.getLiveMatches() : [];
    const map = {};
    list.forEach(x => { if (x && x.id) map[Number(x.id)] = { hs: Number(x.hs) || 0, aws: Number(x.aws) || 0 }; });
    return map;
  }

  function computeStats() {
    const teams = (S && Array.isArray(S.teams)) ? S.teams : [];
    const matches = (S && Array.isArray(S.matches)) ? S.matches : [];
    const liveMap = getLiveMap();
    const winPts = Number((S && S.settings && S.settings.win) ?? 3);
    const drawPts = Number((S && S.settings && S.settings.draw) ?? 1);
    const lossPts = Number((S && S.settings && S.settings.loss) ?? 0);

    const stats = {};
    teams.forEach(t => {
      stats[t.id] = {
        id: t.id, name: t.name, isLive: false,
        all:  { o: 0, g: 0, b: 0, m: 0, ag: 0, yg: 0, p: 0 },
        home: { o: 0, g: 0, b: 0, m: 0, ag: 0, yg: 0, p: 0 },
        away: { o: 0, g: 0, b: 0, m: 0, ag: 0, yg: 0, p: 0 },
        upcoming: []
      };
    });

    matches.forEach(m => {
      if (!stats[m.home_id] || !stats[m.away_id]) return;
      const live = !m.played ? liveMap[Number(m.id)] : null;
      if (!m.played && !live) {
        stats[m.home_id].upcoming.push({ week: m.week, oppId: m.away_id, side: 'Ev' });
        stats[m.away_id].upcoming.push({ week: m.week, oppId: m.home_id, side: 'Dep' });
        return;
      }
      const hs = live ? live.hs : Number(m.hs || 0);
      const aws = live ? live.aws : Number(m.aws || 0);
      const h = stats[m.home_id], a = stats[m.away_id];
      if (live) { h.isLive = true; a.isLive = true; }

      h.all.o++; h.home.o++; a.all.o++; a.away.o++;
      h.all.ag += hs; h.all.yg += aws; h.home.ag += hs; h.home.yg += aws;
      a.all.ag += aws; a.all.yg += hs; a.away.ag += aws; a.away.yg += hs;

      if (hs > aws) {
        h.all.g++; h.home.g++; h.all.p += winPts; h.home.p += winPts;
        a.all.m++; a.away.m++; a.all.p += lossPts; a.away.p += lossPts;
      } else if (aws > hs) {
        a.all.g++; a.away.g++; a.all.p += winPts; a.away.p += winPts;
        h.all.m++; h.home.m++; h.all.p += lossPts; h.home.p += lossPts;
      } else {
        h.all.b++; h.home.b++; h.all.p += drawPts; h.home.p += drawPts;
        a.all.b++; a.away.b++; a.all.p += drawPts; a.away.p += drawPts;
      }
    });
    return stats;
  }

  window.openKrdTeamProfile = function(teamId) {
    let modal = document.getElementById('krdTeamModal');
    if (!modal) {
      modal = document.createElement('div');
      modal.id = 'krdTeamModal';
      modal.className = 'modal';
      modal.innerHTML = '<div class="krd-tm-card" id="krdTeamModalBody"></div>';
      modal.addEventListener('click', e => {
        if (e.target === modal) { modal.classList.remove('open'); document.body.classList.remove('krd-modal-open'); }
      });
      document.body.appendChild(modal);
    }
    const stats = computeStats();
    const st = stats[teamId];
    if (!st) return;
    const tMap = Object.fromEntries((S.teams || []).map(t => [t.id, t.name]));
    const ranked = Object.values(stats).sort((a, b) => (b.all.p - a.all.p) || ((b.all.ag - b.all.yg) - (a.all.ag - a.all.yg)));
    const rankMap = Object.fromEntries(ranked.map((x, i) => [x.id, i + 1]));

    const tot = Math.max(1, st.all.o);
    const wPct = Math.round((st.all.g / tot) * 100);
    const dPct = Math.round((st.all.b / tot) * 100);
    const lPct = Math.max(0, 100 - wPct - dPct);

    document.getElementById('krdTeamModalBody').innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div>
          <div style="font-size:11px;color:#38bdf8;font-weight:800;">SIRA #${rankMap[teamId] || '-'} ${st.isLive ? '• 🔴 CANLI MAÇTA' : ''}</div>
          <div style="font-size:18px;font-weight:900;">${esc(st.name)}</div>
        </div>
        <button type="button" onclick="document.getElementById('krdTeamModal').classList.remove('open');document.body.classList.remove('krd-modal-open');" style="padding:4px 10px;">✕</button>
      </div>
      <div>
        <div style="display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:4px;">
          <span style="color:#4ade80;">G %${wPct} (${st.all.g})</span>
          <span style="color:#facc15;">B %${dPct} (${st.all.b})</span>
          <span style="color:#f87171;">M %${lPct} (${st.all.m})</span>
        </div>
        <div class="krd-wdl-bar">
          <div style="width:${wPct}%;background:#22c55e;"></div>
          <div style="width:${dPct}%;background:#eab308;"></div>
          <div style="width:${lPct}%;background:#ef4444;"></div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center;font-size:12px;">
        <div style="background:rgba(255,255,255,0.05);padding:8px;border-radius:10px;"><b>${st.all.o ? (st.all.ag / st.all.o).toFixed(1) : '0.0'}</b><div style="font-size:10px;opacity:.75;">Gol Ort.</div></div>
        <div style="background:rgba(255,255,255,0.05);padding:8px;border-radius:10px;"><b>${st.all.o ? (st.all.yg / st.all.o).toFixed(1) : '0.0'}</b><div style="font-size:10px;opacity:.75;">Yenen Ort.</div></div>
        <div style="background:rgba(255,255,255,0.05);padding:8px;border-radius:10px;"><b>${st.home.p} / ${st.away.p}</b><div style="font-size:10px;opacity:.75;">Ev / Dep P</div></div>
      </div>
      <div>
        <div style="font-size:11.5px;font-weight:800;margin-bottom:5px;color:#facc15;">Kalan Maçlar:</div>
        ${st.upcoming.length ? `<div style="display:flex;flex-wrap:wrap;gap:5px;">
          ${st.upcoming.map(u => {
            const r = rankMap[u.oppId] || 4;
            const cls = r <= 2 ? 'krd-fdr-hard' : r <= Math.ceil(ranked.length * 0.65) ? 'krd-fdr-mid' : 'krd-fdr-easy';
            return `<span class="krd-fdr-dot ${cls}">H${u.week} ${esc(tMap[u.oppId] || '')} (${u.side})</span>`;
          }).join('')}
        </div>` : '<div class="mut" style="font-size:12px;">Kalan maç yok.</div>'}
      </div>
    `;
    modal.classList.add('open');
    document.body.classList.add('krd-modal-open');
  };

  function copyPublishText(type) {
    const tMap = Object.fromEntries((S.teams || []).map(t => [t.id, t.name]));
    const name = (S.settings && S.settings.name) || 'KRD LİGİ';
    let txt = '';
    if (type === 'table') {
      const stats = computeStats();
      const rows = Object.values(stats).sort((a, b) => (b.all.p - a.all.p) || ((b.all.ag - b.all.yg) - (a.all.ag - a.all.yg)));
      txt = `🏆 ${name} — PUAN DURUMU\n\n` + rows.map((r, i) => `${i === 0 ? '👑' : (i + 1) + '.'} ${r.name} — ${r.all.p} P (AV ${r.all.ag - r.all.yg})`).join('\n');
    } else {
      const played = (S.matches || []).filter(m => m.played);
      const wk = played.length ? Math.max(...played.map(m => Number(m.week || 1))) : 1;
      txt = `⚽ ${name} — ${wk}. HAFTA SONUÇLARI\n\n` + played.filter(m => Number(m.week || 1) === wk).map(m => `▪️ ${tMap[m.home_id]} ${m.hs}-${m.aws} ${tMap[m.away_id]}`).join('\n');
    }
    navigator.clipboard?.writeText(txt).then(() => typeof toast === 'function' && toast('Panoya kopyalandı!'));
  }

  function applyFixtureFilters() {
    const grid = document.querySelector('#app .grid');
    if (!grid) return;
    Array.from(grid.children).forEach(card => {
      const txt = (card.textContent || '').toLowerCase();
      const okQ = !fQuery || txt.includes(fQuery);
      const okT = !fTeam || txt.includes(fTeam);
      const okW = !fWeek || txt.includes(`hafta ${fWeek}`) || txt.includes(`h${fWeek}`) || txt.includes(`${fWeek}. hafta`);
      card.style.display = (okQ && okT && okW) ? '' : 'none';
    });
  }

  function syncCleanUI() {
    if (typeof S === 'undefined' || !Array.isArray(S.teams) || !S.teams.length || isAdminView()) return;
    const app = document.getElementById('app');
    if (!app) return;

    const stats = computeStats();
    const liveMap = getLiveMap();
    const hasLive = Object.keys(liveMap).length > 0;
    const tMap = Object.fromEntries(S.teams.map(t => [t.id, t.name]));

    // 1. Puan Tablosu (Genel / Ic Saha / Deplasman + Canli Skor)
    const origTbl = app.querySelector('table:not(#krdSplitTableWrap table)');
    if (origTbl) {
      if (!document.getElementById('krdSplitTabs')) {
        const tabs = document.createElement('div');
        tabs.id = 'krdSplitTabs';
        tabs.innerHTML = `
          <button type="button" class="krd-split-btn active" data-mode="all">Genel</button>
          <button type="button" class="krd-split-btn" data-mode="home">İç Saha</button>
          <button type="button" class="krd-split-btn" data-mode="away">Deplasman</button>
        `;
        origTbl.parentNode.insertBefore(tabs, origTbl);
        tabs.querySelectorAll('.krd-split-btn').forEach(b => {
          b.addEventListener('click', () => {
            tableMode = b.dataset.mode || 'all';
            lastTableSig = '';
            tabs.querySelectorAll('.krd-split-btn').forEach(x => x.classList.remove('active'));
            b.classList.add('active');
            syncCleanUI();
          });
        });
      }

      let wrap = document.getElementById('krdSplitTableWrap');
      if (!wrap) {
        wrap = document.createElement('div');
        wrap.id = 'krdSplitTableWrap';
        origTbl.parentNode.insertBefore(wrap, origTbl.nextSibling);
      }

      const useCustom = tableMode !== 'all' || hasLive;
      if (!useCustom) {
        origTbl.style.display = '';
        wrap.classList.remove('active');
        lastTableSig = '';
        origTbl.querySelectorAll('tbody tr').forEach((tr, idx) => {
          tr.classList.remove('krd-rank-1', 'krd-rank-top', 'krd-rank-last');
          if (idx === 0) tr.classList.add('krd-rank-1');
          else if (idx <= 2) tr.classList.add('krd-rank-top');
          const cell = tr.children[1] || tr.children[0];
          if (cell && !cell.dataset.krdLinked) {
            const tm = S.teams.find(t => (tr.textContent || '').toLowerCase().includes((t.name || '').toLowerCase()));
            if (tm) {
              cell.dataset.krdLinked = '1';
              cell.classList.add('krd-team-link');
              cell.addEventListener('click', () => window.openKrdTeamProfile(tm.id));
            }
          }
        });
      } else {
        origTbl.style.display = 'none';
        wrap.classList.add('active');
        const mode = tableMode;
        const rows = Object.values(stats)
          .map(s => ({ id: s.id, name: s.name, isLive: s.isLive, ...s[mode], av: s[mode].ag - s[mode].yg }))
          .sort((a, b) => (b.p - a.p) || (b.av - a.av) || (b.ag - a.ag));
        const sig = mode + '|' + JSON.stringify(rows);
        if (sig !== lastTableSig) {
          lastTableSig = sig;
          wrap.innerHTML = `
            <table style="width:100%;">
              <thead><tr><th>#</th><th style="text-align:left;">Oyuncu</th><th>O</th><th>G</th><th>B</th><th>M</th><th>AG</th><th>YG</th><th>AV</th><th>P</th></tr></thead>
              <tbody>
                ${rows.map((r, i) => `
                  <tr class="${i === 0 ? 'krd-rank-1' : i <= 2 ? 'krd-rank-top' : ''}">
                    <td><b>${i + 1}</b></td>
                    <td style="text-align:left;" class="krd-team-link" onclick="window.openKrdTeamProfile(${r.id})">
                      <b>${esc(r.name)}</b>${r.isLive ? '<span class="krd-live-pill">🔴 CANLI</span>' : ''}
                    </td>
                    <td>${r.o}</td><td>${r.g}</td><td>${r.b}</td><td>${r.m}</td>
                    <td>${r.ag}</td><td>${r.yg}</td>
                    <td>${r.av > 0 ? '+' + r.av : r.av}</td>
                    <td><b>${r.p}</b></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          `;
        }
      }

      // 2. Toplanabilir Lig Merkezi Cekmecesi (Istatistikler + Oduller + H2H + Kopyala)
      if (!document.getElementById('krdLeagueHubDrawer')) {
        const played = (S.matches || []).filter(m => m.played);
        const totalGoals = played.reduce((s, m) => s + Number(m.hs || 0) + Number(m.aws || 0), 0);
        const allArr = Object.values(stats).filter(x => x.all.o > 0);
        const bestAtk = [...allArr].sort((a, b) => b.all.ag - a.all.ag)[0];
        const bestDef = [...allArr].sort((a, b) => a.all.yg - b.all.yg)[0];

        const drawer = document.createElement('details');
        drawer.id = 'krdLeagueHubDrawer';
        drawer.className = 'card';
        const optsA = S.teams.map((t, i) => `<option value="${t.id}" ${i === 0 ? 'selected' : ''}>${esc(t.name)}</option>`).join('');
        const optsB = S.teams.map((t, i) => `<option value="${t.id}" ${i === 1 ? 'selected' : ''}>${esc(t.name)}</option>`).join('');

        drawer.innerHTML = `
          <summary>
            <span>📊 Lig Merkezi (İstatistikler, H2H & Paylaşım)</span>
            <span class="mut" style="font-size:11px;">Aç ▾</span>
          </summary>
          <div class="krd-hub-body">
            <div class="krd-mini-grid">
              <div class="krd-mini-card"><div class="t">Toplam Gol</div><div class="v">⚽ ${totalGoals}</div></div>
              <div class="krd-mini-card"><div class="t">Maç Ortalaması</div><div class="v">📈 ${played.length ? (totalGoals / played.length).toFixed(2) : '0.00'}</div></div>
              <div class="krd-mini-card"><div class="t">En Golcü</div><div class="v">${esc(bestAtk ? bestAtk.name + ' (' + bestAtk.all.ag + ')' : '-')}</div></div>
              <div class="krd-mini-card"><div class="t">En İyi Savunma</div><div class="v">${esc(bestDef ? bestDef.name + ' (' + bestDef.all.yg + ')' : '-')}</div></div>
            </div>

            <div style="display:grid;gap:6px;background:rgba(255,255,255,0.03);padding:10px;border-radius:10px;">
              <div style="font-size:11.5px;font-weight:800;">⚔️ Kafa Kafaya (H2H) Karşılaştır</div>
              <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;">
                <select aria-label="Secim listesi" id="krdHubH2HA">${optsA}</select>
                <span class="mut" style="font-size:11px;">VS</span>
                <select aria-label="Secim listesi" id="krdHubH2HB">${optsB}</select>
              </div>
              <div id="krdHubH2HOut" style="font-size:12px;"></div>
            </div>

            <div style="display:flex;flex-wrap:wrap;gap:6px;">
              <button type="button" id="krdHubCopyTbl" style="font-size:11.5px;">📋 Puan Durumu Kopyala</button>
              <button type="button" id="krdHubCopyWk" style="font-size:11.5px;">📢 Son Hafta Kopyala</button>
            </div>
          </div>
        `;
        wrap.parentNode.insertBefore(drawer, wrap.nextSibling);

        const calcH2H = () => {
          const aId = Number(document.getElementById('krdHubH2HA').value);
          const bId = Number(document.getElementById('krdHubH2HB').value);
          const out = document.getElementById('krdHubH2HOut');
          if (!aId || !bId || aId === bId) { out.innerHTML = '<span class="mut">İki farklı oyuncu seçin.</span>'; return; }
          const list = played.filter(m => (m.home_id === aId && m.away_id === bId) || (m.home_id === bId && m.away_id === aId));
          if (!list.length) { out.innerHTML = '<span class="mut">Henüz maç oynamadılar.</span>'; return; }
          let aw = 0, bw = 0, dr = 0;
          list.forEach(m => {
            const ag = m.home_id === aId ? Number(m.hs) : Number(m.aws);
            const bg = m.home_id === bId ? Number(m.hs) : Number(m.aws);
            if (ag > bg) aw++; else if (bg > ag) bw++; else dr++;
          });
          out.innerHTML = `<b>${esc(tMap[aId])}: ${aw}G</b> • Beraberlik: ${dr} • <b>${esc(tMap[bId])}: ${bw}G</b>`;
        };
        document.getElementById('krdHubH2HA').addEventListener('change', calcH2H);
        document.getElementById('krdHubH2HB').addEventListener('change', calcH2H);
        document.getElementById('krdHubCopyTbl').addEventListener('click', () => copyPublishText('table'));
        document.getElementById('krdHubCopyWk').addEventListener('click', () => copyPublishText('week'));
        calcH2H();
      }
    }

    // 3. Tek Satir Kompakt Fikstur Filtresi
    const matchGrid = app.querySelector('.grid');
    if (matchGrid && !document.getElementById('krdUnifiedFilterBar')) {
      const weeks = [...new Set((S.matches || []).map(m => Number(m.week || 1)))].sort((a, b) => a - b);
      const uBar = document.createElement('div');
      uBar.id = 'krdUnifiedFilterBar';
      uBar.innerHTML = `
        <input type="search" id="krdUniSearch" placeholder="🔎 Takım veya skor ara...">
        <select aria-label="Secim listesi" id="krdUniWeek"><option value="">Tüm Haftalar</option>${weeks.map(w => `<option value="${w}">${w}. Hafta</option>`).join('')}</select>
        <select aria-label="Secim listesi" id="krdUniTeam"><option value="">Tüm Takımlar</option>${S.teams.map(t => `<option value="${esc(t.name.toLowerCase())}">${esc(t.name)}</option>`).join('')}</select>
      `;
      matchGrid.parentNode.insertBefore(uBar, matchGrid);

      document.getElementById('krdUniSearch').addEventListener('input', e => { fQuery = e.target.value.trim().toLowerCase(); applyFixtureFilters(); });
      document.getElementById('krdUniWeek').addEventListener('change', e => { fWeek = e.target.value; applyFixtureFilters(); });
      document.getElementById('krdUniTeam').addEventListener('change', e => { fTeam = e.target.value; applyFixtureFilters(); });
    }

    // 4. Fikstur Kartlarinda Canli Mac Vurgusu
    if (matchGrid) {
      const liveIds = Object.keys(liveMap).map(Number);
      Array.from(matchGrid.children).forEach(card => {
        const txt = card.textContent || '';
        let hit = null;
        for (const mid of liveIds) {
          const m = (S.matches || []).find(x => Number(x.id) === mid);
          if (m && !m.played && txt.includes(tMap[m.home_id] || '') && txt.includes(tMap[m.away_id] || '')) {
            hit = liveMap[mid];
            break;
          }
        }
        if (hit) {
          card.classList.add('krd-live-fixture-card');
          let b = card.querySelector('.krd-card-live-banner');
          if (!b) {
            b = document.createElement('div');
            b.className = 'krd-card-live-banner';
            b.style.cssText = 'display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid rgba(239,68,68,0.28);';
            card.insertBefore(b, card.firstChild);
          }
          const nextH = `<span class="krd-live-pill" style="margin-left:0;">🔴 CANLI</span><span class="krd-live-score-box">${hit.hs} - ${hit.aws}</span>`;
          if (b.innerHTML !== nextH) b.innerHTML = nextH;
        } else {
          card.classList.remove('krd-live-fixture-card');
          card.querySelector('.krd-card-live-banner')?.remove();
        }
      });
    }
  }

  // Tek hafif motor (1.1 sn)
  setInterval(syncCleanUI, 1100);
})();
</script>

<script id="krdSilentLiveSync">
(function(){
  let lastSnap = '';
  async function syncCheck(init) {
    try {
      if (typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
      const [r1, r2] = await Promise.all([
        fetch('/api/league?t=' + Date.now(), { cache: 'no-store' }),
        fetch('/api/krd-extras?t=' + Date.now(), { cache: 'no-store' }).catch(() => null)
      ]);
      const d = await r1.json();
      const ex = r2 ? await r2.json().catch(() => ({})) : {};
      const lb = ex && ex.lastBroadcast;
      if (lb && lb.id && String(lb.id) !== localStorage.getItem('krd_last_bc_id')) {
        localStorage.setItem('krd_last_bc_id', String(lb.id));
        if (!init) {
          const reg = await navigator.serviceWorker.ready;
          if (reg && reg.showNotification) {
            await reg.showNotification(lb.title || '📢 KRD Ligi Duyuru', {
              body: lb.body || '',
              icon: '/icon-192.png',
              tag: 'krd-ligi-genel'
            });
          }
        }
      }
      const played = Array.isArray(d && d.matches) ? d.matches.filter(m => m.played).map(m => m.id + ':' + m.hs + '-' + m.aws).join(',') : '';
      if (!init && lastSnap && played !== lastSnap) {
        const reg = await navigator.serviceWorker.ready;
        if (reg && reg.showNotification) {
          await reg.showNotification('⚽ KRD Ligi Güncellemesi', {
            body: 'Yeni maç skoru işlendi, puan durumunu kontrol et!',
            icon: '/icon-192.png',
            tag: 'krd-score-update'
          });
        }
      }
      lastSnap = played;
    } catch {}
  }
  window.addEventListener('load', () => syncCheck(true));
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncCheck(false); });
  setInterval(() => syncCheck(false), 10000);
})();
</script>
<script id="krdChampSimulator">
(function(){
  function mountSimulator() {
    if (typeof S === 'undefined' || !Array.isArray(S.teams) || !Array.isArray(S.matches)) return;
    const slug = (S.settings && S.settings.admin_slug) ? S.settings.admin_slug : 'krd-kontrol';
    if (location.hash.startsWith('#/yonetici') || location.hash.startsWith('#/' + slug)) return;
    const app = document.getElementById('app');
    if (!app || document.getElementById('krdSimBox')) return;

    const rem = S.matches.filter(m => !m.played);
    if (!rem.length) return;
    const tMap = Object.fromEntries(S.teams.map(t => [t.id, t]));

    const box = document.createElement('details');
    box.id = 'krdSimBox';
    box.className = 'card';
    box.style.marginTop = '12px';
    box.innerHTML = `
      <summary style="cursor:pointer;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:space-between;">
        <span>🧮 Canlı Şampiyonluk & Averaj Simülatörü (${rem.length} Kalan Maç)</span>

      </summary>

      <div id="krdSimMatches" style="display:grid;gap:6px;margin-top:10px;max-height:240px;overflow-y:auto;padding-right:4px;">
        ${rem.map(m => `
          <div data-sim-mid="${m.id}" data-hid="${m.home_id}" data-aid="${m.away_id}" style="display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 8px;background:rgba(15,23,42,0.55);border-radius:8px;font-size:12.5px;">
            <span style="font-size:10.5px;opacity:.65;min-width:26px;">H${m.week}</span>
            <span style="flex:1;text-align:right;font-weight:700;">${(tMap[m.home_id]?.name || 'Ev')}</span>
            <input type="number" min="0" max="30" placeholder="-" data-shs style="width:40px;text-align:center;padding:3px;border-radius:6px;">
            <span>:</span>
            <input type="number" min="0" max="30" placeholder="-" data-saws style="width:40px;text-align:center;padding:3px;border-radius:6px;">
