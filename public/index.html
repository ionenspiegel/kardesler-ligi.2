<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kardeşler Ligi</title>
<style>
:root{--bg:#070b16;--card:#111a2e;--card2:#16223c;--line:#24345a;--tx:#eaf0ff;--mut:#8fa0c8;--g:#22e08a;--y:#ffd23f;--r:#ff4d6d;--b:#4da3ff}
*{box-sizing:border-box}body{margin:0;font:16px/1.4 system-ui,Segoe UI,Roboto,sans-serif;color:var(--tx);background:radial-gradient(1200px 600px at 80% -10%,#1b3a8a55,transparent),radial-gradient(900px 500px at -10% 10%,#0e8f5a44,transparent),var(--bg);min-height:100vh}
a{color:inherit}.wrap{max-width:1000px;margin:auto;padding:16px}
.hero{padding:28px 20px;border-radius:22px;background:linear-gradient(120deg,#0f7a4f,#1a47c9 60%,#6a2bd9);position:relative;overflow:hidden;animation:in .6s both}
.hero:after{content:"⚽";position:absolute;right:-10px;top:-20px;font-size:150px;opacity:.15;animation:spin 14s linear infinite}
.hero h1{margin:0;font-size:clamp(26px,6vw,42px);letter-spacing:.5px}.hero p{margin:6px 0 0;opacity:.9}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.chip{background:#ffffff26;padding:4px 12px;border-radius:99px;font-size:13px;backdrop-filter:blur(4px)}
h2{margin:26px 0 10px;font-size:18px;display:flex;align-items:center;gap:8px}h2:before{content:"";width:5px;height:20px;border-radius:3px;background:var(--g)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;animation:in .5s both}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:520px}th{font-size:12px;color:var(--mut);text-align:center;padding:8px 6px;font-weight:600}td{padding:10px 6px;text-align:center;border-top:1px solid var(--line)}
td.n,th.n{text-align:left}tbody tr{animation:row .5s both}tbody tr:hover{background:var(--card2)}.pts{font-weight:800;color:var(--g);font-size:17px}
.pos{width:26px;height:26px;display:inline-grid;place-items:center;border-radius:8px;background:var(--card2);font-weight:700;font-size:13px}tr:nth-child(1) .pos{background:var(--y);color:#222}
.b{display:inline-grid;place-items:center;min-width:34px;height:34px;padding:0 4px;border-radius:50%;background:var(--c);color:#fff;font-weight:800;font-size:11px;box-shadow:0 0 0 3px #ffffff18,0 4px 14px color-mix(in srgb,var(--c) 50%,transparent);vertical-align:middle;margin-right:8px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.m{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;background:var(--card2);border-radius:14px;padding:12px;animation:in .5s both;transition:transform .2s}.m:hover{transform:translateY(-3px)}
.m .t{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;text-align:center}.m .t .b{margin:0;width:44px;height:44px;font-size:13px}
.sc{font-size:28px;font-weight:900;letter-spacing:2px;min-width:80px;text-align:center}.sc small{display:block;font-size:11px;font-weight:600;color:var(--mut);letter-spacing:0}.sc.pop span{display:inline-block;animation:pop .6s}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:#ffffff14;color:var(--mut)}.tag.live{background:#ff4d6d33;color:var(--r);animation:blink 1.2s infinite}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:9px 14px;background:var(--card2);transition:.15s;border:1px solid var(--line)}button:hover{filter:brightness(1.25);transform:translateY(-1px)}button:active{transform:scale(.95)}
.pri{background:linear-gradient(90deg,#14b36b,#1f6fe0);border:0;font-weight:700}.dng{background:#ff4d6d22;color:var(--r);border-color:#ff4d6d55}
.gb{width:42px;height:42px;font-size:22px;font-weight:900;padding:0;border-radius:50%}.gb.plus{background:#22e08a22;color:var(--g);border-color:#22e08a66}
input,select{background:#0b1226;border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}input[type=color]{padding:2px;height:40px;width:56px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1 1 120px}.row>button{flex:0 0 auto}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:16px 0}.tabs button{white-space:nowrap}.tabs .on{background:var(--g);color:#052;font-weight:800;border-color:var(--g)}
.ctr{display:flex;gap:6px;align-items:center;justify-content:center;margin-top:8px}.mc{grid-column:1/-1;display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-top:4px}
.login{max-width:380px;margin:12vh auto}.login .card{padding:22px;display:grid;gap:12px}label{font-size:13px;color:var(--mut);display:grid;gap:4px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.mut{color:var(--mut);font-size:13px}.empty{text-align:center;color:var(--mut);padding:24px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:#16223c;border:1px solid var(--g);padding:10px 18px;border-radius:12px;transition:.3s;z-index:9}#toast.show{transform:translateX(-50%)}#toast.err{border-color:var(--r)}
#goal{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;font-size:clamp(60px,18vw,140px);font-weight:900;color:#fff;text-shadow:0 0 40px var(--g);opacity:0;z-index:8}#goal.go{animation:goal 1s}
@keyframes in{from{opacity:0;transform:translateY(14px)}}@keyframes row{from{opacity:0;transform:translateX(-24px)}}@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(.5)}50%{transform:scale(1.6);color:var(--g)}100%{transform:scale(1)}}@keyframes blink{50%{opacity:.4}}
@keyframes goal{0%{opacity:0;transform:scale(.3) rotate(-8deg)}25%{opacity:1;transform:scale(1.15)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.4)}}
@media(max-width:560px){.wrap{padding:10px}.sc{font-size:24px;min-width:64px}}
</style></head><body><div id="goal">GOL!</div><div class="wrap" id="app"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={settings:{},teams:[],matches:[],table:[]},ME={},tab='m',wk=0,bump=null;
async function api(m,u,b){const r=await fetch(u,{method:m,headers:{'Content-Type':'application/json','X-KL':'1'},body:b?JSON.stringify(b):undefined});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Hata');return d}
function toast(t,err){const e=$('#toast');e.textContent=t;e.className='show'+(err?' err':'');clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='',2600)}
async function act(f,ok){try{await f();if(ok)toast(ok);await load();render()}catch(e){toast(e.message,1)}}
async function load(){[S,ME]=await Promise.all([api('GET','/api/league'),api('GET','/api/me')])}
const T=id=>S.teams.find(t=>t.id===id)||{name:'?',color:'#888'};
const badge=t=>`<span class="b" style="--c:${esc(t.color)}">${esc(t.short||t.name.slice(0,3).toUpperCase())}</span>`;
function mcard(m,adm){const h=T(m.home_id),a=T(m.away_id),live=!m.played&&(m.hs||m.aws),b=bump===m.id;
 return `<div class="m"><div class="t">${badge(h)}${esc(h.name)}</div><div class="sc ${b?'pop':''}"><span>${m.hs} - ${m.aws}</span><small>${m.played?'Bitti':live?'<span class="tag live">CANLI</span>':'Hafta '+m.week}</small></div><div class="t">${badge(a)}${esc(a.name)}</div>
 ${adm?`<div class="mc"><div class="ctr"><button class="gb" onclick="g(${m.id},'hs',-1)">−</button><button class="gb plus" onclick="g(${m.id},'hs',1)">+</button></div><button onclick="fin(${m.id},${m.played?0:1})">${m.played?'↩ Aç':'✔ Bitir'}</button><button class="dng" onclick="delM(${m.id})">🗑</button><div class="ctr"><button class="gb" onclick="g(${m.id},'aws',-1)">−</button><button class="gb plus" onclick="g(${m.id},'aws',1)">+</button></div></div>`:''}</div>`}
function home(){const s=S.settings,pl=S.matches.filter(m=>m.played).sort((a,b)=>(b.updated||'').localeCompare(a.updated||'')||b.id-a.id).slice(0,6),nx=S.matches.filter(m=>!m.played).slice(0,6);
 return `<div class="hero"><h1>🏆 ${esc(s.name)}</h1><p>Sezon ${esc(s.season)}</p><div class="chips"><span class="chip">Hafta ${esc(s.week)}</span><span class="chip">${S.teams.length} takım</span><span class="chip">${S.matches.filter(m=>m.played).length} maç oynandı</span></div></div>
 <h2>Puan Durumu</h2><div class="card tw">${S.table.length?`<table><thead><tr><th>#<th class="n">Takım<th>O<th>G<th>B<th>M<th>AG<th>YG<th>Av<th>P</tr></thead><tbody>${S.table.map((t,i)=>`<tr style="animation-delay:${i*60}ms"><td><span class="pos">${i+1}</span><td class="n">${badge(t)}${esc(t.name)}<td>${t.p}<td>${t.w}<td>${t.d}<td>${t.l}<td>${t.gf}<td>${t.ga}<td>${t.gd>0?'+':''}${t.gd}<td class="pts">${t.pts}</tr>`).join('')}</tbody></table>`:'<div class="empty">Henüz takım yok.</div>'}</div>
 <h2>Son Maçlar</h2>${pl.length?`<div class="grid">${pl.map(m=>mcard(m)).join('')}</div>`:'<div class="card empty">Henüz oynanan maç yok.</div>'}
 ${nx.length?`<h2>Sıradaki Maçlar</h2><div class="grid">${nx.map(m=>mcard(m)).join('')}</div>`:''}
 <p class="mut" style="text-align:center;margin-top:30px"><a href="#/yonetici">Yönetici girişi</a></p>`}
function login(){if(ME.needsSetup)return `<div class="login"><form class="card" onsubmit="return setup(event)"><h2 style="margin:0">🔐 İlk Kurulum</h2><p class="mut">Sunucu konsolunda yazan kurulum kodunu gir ve Yusuf için şifre belirle.</p><label>Kurulum kodu<input name="c" required autocomplete="off"></label><label>Yusuf'un şifresi (en az 8)<input name="p" type="password" minlength="8" required autocomplete="new-password"></label><button class="pri">Yönetici hesabını oluştur</button><a class="mut" href="#/">← Lige dön</a></form></div>`;
 return `<div class="login"><form class="card" onsubmit="return doLogin(event)"><h2 style="margin:0">🔐 Yönetici Girişi</h2><label>Kullanıcı adı<input name="u" required autocomplete="username"></label><label>Şifre<input name="p" type="password" required autocomplete="current-password"></label><button class="pri">Giriş yap</button><a class="mut" href="#/">← Lige dön</a></form></div>`}
const setup=e=>{e.preventDefault();const f=e.target;act(()=>api('POST','/api/admin/setup',{code:f.c.value,password:f.p.value}),'Hesap oluşturuldu');return false};
const doLogin=e=>{e.preventDefault();const f=e.target;act(()=>api('POST','/api/admin/login',{username:f.u.value,password:f.p.value}),'Hoş geldin Yusuf');return false};
function panel(){const weeks=[...new Set(S.matches.map(m=>m.week))].sort((a,b)=>a-b);if(!wk||!weeks.includes(wk))wk=+S.settings.week&&weeks.includes(+S.settings.week)?+S.settings.week:weeks[0]||1;
 const tabs=[['m','⚽ Maçlar'],['t','👕 Takımlar'],['f','📅 Fikstür'],['s','⚙ Ayarlar']];let c='';
 if(tab==='m')c=`<div class="tabs">${weeks.map(w=>`<button class="${w===wk?'on':''}" onclick="wk=${w};render()">H${w}</button>`).join('')}</div>${S.matches.some(m=>m.week===wk)?`<div class="grid">${S.matches.filter(m=>m.week===wk).map(m=>mcard(m,1)).join('')}</div>`:'<div class="card empty">Bu haftada maç yok. Aşağıdan ekle ya da fikstür oluştur.</div>'}
 <h2>Maç Ekle</h2><form class="card row" onsubmit="return addM(event)"><input name="w" type="number" min="1" value="${wk}" title="Hafta"><select name="h">${S.teams.map(t=>`<option value="${t.id}">${esc(t.name)}`).join('')}</select><select name="a">${S.teams.map((t,i)=>`<option value="${t.id}" ${i==1?'selected':''}>${esc(t.name)}`).join('')}</select><button class="pri">Ekle</button></form>`;
 if(tab==='t')c=`<form class="card row" onsubmit="return addT(event)"><input name="n" placeholder="Takım adı" required maxlength="40"><input name="s" placeholder="Kısa ad" maxlength="4" style="max-width:100px"><input name="c" type="color" value="#22c55e"><button class="pri">Takım ekle</button></form><div class="grid" style="margin-top:12px">${S.teams.map(t=>`<form class="card row" onsubmit="return editT(event,${t.id})">${badge(t)}<input name="n" value="${esc(t.name)}" required maxlength="40"><input name="s" value="${esc(t.short||'')}" maxlength="4" style="max-width:80px"><input name="c" type="color" value="${esc(t.color)}"><button>💾</button><button type="button" class="dng" onclick="delT(${t.id},'${esc(t.name).replace(/'/g,'')}')">🗑</button></form>`).join('')||'<div class="card empty">Takım yok.</div>'}</div>`;
 if(tab==='f')c=`<div class="card" style="display:grid;gap:10px"><b>Otomatik Fikstür</b><p class="mut" style="margin:0">Tüm takımlar birbiriyle oynar. Mevcut (oynanmamış) fikstürün yerine yenisi yazılır; oynanmış maç varsa engellenir.</p><div class="row"><button class="pri" onclick="fx(false)">Tek devre</button><button class="pri" onclick="fx(true)">Çift devre</button></div></div>
 <h2>Yeni Sezon</h2><form class="card row" onsubmit="return ns(event)"><input name="n" placeholder="Sezon adı (örn. 2027)" required><button class="dng">Yeni sezon başlat</button></form><p class="mut">Takımlar korunur, tüm maçlar silinir.</p>`;
 if(tab==='s'){const s=S.settings;c=`<form class="card" style="display:grid;gap:10px" onsubmit="return sv(event)"><div class="row"><label>Lig adı<input name="name" value="${esc(s.name)}" required></label><label>Sezon<input name="season" value="${esc(s.season)}" required></label><label>Güncel hafta<input name="week" type="number" min="1" value="${esc(s.week)}"></label></div><div class="row"><label>Galibiyet puanı<input name="win" type="number" min="0" value="${esc(s.win)}"></label><label>Beraberlik<input name="draw" type="number" min="0" value="${esc(s.draw)}"></label><label>Mağlubiyet<input name="loss" type="number" min="0" value="${esc(s.loss)}"></label></div><button class="pri">Kaydet</button></form>
 <h2>Şifre Değiştir</h2><form class="card row" onsubmit="return pw(event)"><input name="c" type="password" placeholder="Mevcut şifre" required autocomplete="current-password"><input name="n" type="password" placeholder="Yeni şifre (en az 8)" minlength="8" required autocomplete="new-password"><button class="pri">Değiştir</button></form>
 <h2>Yedek</h2><a href="/api/admin/backup"><button>⬇ JSON yedeği indir</button></a>`}
 return `<div class="top"><h2 style="margin:0">🛡 Yönetici Paneli — Yusuf</h2><div class="row" style="flex:0"><a href="#/"><button>Lig</button></a><button onclick="out()">Çıkış</button></div></div><div class="tabs">${tabs.map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';render()">${l}</button>`).join('')}</div>${c}`}
function render(){const r=location.hash.startsWith('#/yonetici');$('#app').innerHTML=!r?home():!ME.admin?login():panel();bump=null}
const out=()=>act(()=>api('POST','/api/admin/logout'),'Çıkış yapıldı');
const f=e=>(e.preventDefault(),e.target);
async function g(id,k,d){const m=S.matches.find(x=>x.id===id),v=Math.max(0,m[k]+d);if(v===m[k])return;bump=id;if(d>0){const e=$('#goal');e.className='';void e.offsetWidth;e.className='go'}
 try{await api('PUT','/api/admin/matches/'+id,{[k]:v});await load();render()}catch(e){toast(e.message,1)}}
const fin=(id,p)=>act(()=>api('PUT','/api/admin/matches/'+id,{played:p}),p?'Maç bitti, tablo güncellendi':'Maç yeniden açıldı');
const delM=id=>confirm('Maç silinsin mi?')&&act(()=>api('DELETE','/api/admin/matches/'+id),'Silindi');
const addM=e=>{const x=f(e);act(()=>api('POST','/api/admin/matches',{week:+x.w.value,home_id:+x.h.value,away_id:+x.a.value}),'Maç eklendi');return false};
const addT=e=>{const x=f(e);act(()=>api('POST','/api/admin/teams',{name:x.n.value,short:x.s.value,color:x.c.value}),'Takım eklendi');return false};
const editT=(e,id)=>{const x=f(e);act(()=>api('PUT','/api/admin/teams/'+id,{name:x.n.value,short:x.s.value,color:x.c.value}),'Kaydedildi');return false};
const delT=(id,n)=>confirm(n+' ve tüm maçları silinsin mi?')&&act(()=>api('DELETE','/api/admin/teams/'+id),'Takım silindi');
const fx=d=>act(async()=>{const r=await api('POST','/api/admin/fixture',{double:d});wk=1;tab='m';toast(r.weeks+' haftalık fikstür oluşturuldu')});
const ns=e=>{const x=f(e);confirm('Tüm maçlar silinecek. Emin misin?')&&act(()=>api('POST','/api/admin/season',{name:x.n.value}),'Yeni sezon başladı');return false};
const sv=e=>{const x=f(e),b={};new FormData(x).forEach((v,k)=>b[k]=v);act(()=>api('PUT','/api/admin/settings',b),'Ayarlar kaydedildi');return false};
const pw=e=>{const x=f(e);act(()=>api('POST','/api/admin/password',{current:x.c.value,next:x.n.value}),'Şifre değişti');x.reset();return false};
addEventListener('hashchange',()=>load().then(render));load().then(render);
// Gerçek zamanlı güncelleme (SSE)
const events = new EventSource('/api/events');

events.onmessage = async () => {
  if (document.hidden) return;
  try {
    await load();
    if (!location.hash.startsWith('#/yonetici')) render();
  } catch (e) {
    console.error('Canlı güncelleme hatası:', e);
  }
};
</script></body></html>
