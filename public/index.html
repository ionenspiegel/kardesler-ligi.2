          </div>
        `).join('')}
      </div>
      <div style="display:flex;justify-content:flex-end;margin-top:8px;">
        <button type="button" id="krdSimReset" class="xs">↺ Tahminleri Sıfırla</button>
      </div>
      <div id="krdSimTable" style="margin-top:10px;"></div>
    `;

    app.appendChild(box);

    function calcSim() {
      const stats = {};
      S.teams.forEach(t => { stats[t.id] = { id: t.id, name: t.name, o: 0, g: 0, b: 0, m: 0, ag: 0, yg: 0, p: 0 }; });
      const allMatches = S.matches.map(m => ({ ...m }));
      box.querySelectorAll('[data-sim-mid]').forEach(row => {
        const hsVal = row.querySelector('[data-shs]').value;
        const awsVal = row.querySelector('[data-saws]').value;
        if (hsVal !== '' && awsVal !== '') {
          const target = allMatches.find(x => String(x.id) === row.dataset.simMid);
          if (target) { target.played = 1; target.hs = parseInt(hsVal, 10) || 0; target.aws = parseInt(awsVal, 10) || 0; }
        }
      });
      allMatches.filter(m => m.played).forEach(m => {
        const h = stats[m.home_id], a = stats[m.away_id];
        if (!h || !a) return;
        h.o++; a.o++; h.ag += m.hs; h.yg += m.aws; a.ag += m.aws; a.yg += m.hs;
        if (m.hs > m.aws) { h.g++; h.p += 3; a.m++; }
        else if (m.hs < m.aws) { a.g++; a.p += 3; h.m++; }
        else { h.b++; a.b++; h.p++; a.p++; }
      });
      const playedList = allMatches.filter(m => m.played);
      const list = Object.values(stats).sort((x, y) => {
        if (y.p !== x.p) return y.p - x.p;
        const h2h = playedList.filter(m => (m.home_id === x.id && m.away_id === y.id) || (m.home_id === y.id && m.away_id === x.id));
        if (h2h.length) {
          let xp = 0, yp = 0, xgd = 0, ygd = 0;
          h2h.forEach(m => {
            if (m.home_id === x.id) {
              xgd += (m.hs - m.aws); ygd += (m.aws - m.hs);
              if (m.hs > m.aws) xp += 3; else if (m.hs < m.aws) yp += 3; else { xp++; yp++; }
            } else {
              ygd += (m.hs - m.aws); xgd += (m.aws - m.hs);
              if (m.hs > m.aws) yp += 3; else if (m.hs < m.aws) xp += 3; else { xp++; yp++; }
            }
          });
          if (yp !== xp) return yp - xp;
          if (ygd !== xgd) return ygd - xgd;
        }
        return ((y.ag - y.yg) - (x.ag - x.yg)) || (y.ag - x.ag);
      });
      document.getElementById('krdSimTable').innerHTML = `
        <table style="width:100%;border-collapse:collapse;font-size:12px;">
          <thead><tr style="opacity:.75;border-bottom:1px solid rgba(148,163,184,0.2);">
            <th style="text-align:left;padding:4px;">#</th><th style="text-align:left;padding:4px;">Takım</th>
            <th style="padding:4px;">O</th><th style="padding:4px;">AV</th><th style="padding:4px;">P</th>
          </tr></thead>
          <tbody>
            ${list.map((t, idx) => `
              <tr style="border-bottom:1px solid rgba(148,163,184,0.1);${idx === 0 ? 'background:rgba(22,163,74,0.18);font-weight:800;' : ''}">
                <td style="padding:5px 4px;">${idx === 0 ? '👑' : idx + 1}</td>
                <td style="padding:5px 4px;">${t.name}</td>
                <td style="text-align:center;padding:5px 4px;">${t.o}</td>
                <td style="text-align:center;padding:5px 4px;">${(t.ag - t.yg) > 0 ? '+' + (t.ag - t.yg) : (t.ag - t.yg)}</td>
                <td style="text-align:center;padding:5px 4px;font-weight:800;">${t.p}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    box.addEventListener('input', calcSim);
    document.getElementById('krdSimReset').addEventListener('click', () => {
      box.querySelectorAll('input').forEach(i => i.value = '');
      calcSim();
    });
    calcSim();
  }
  setInterval(mountSimulator, 1200);
})();
</script>

      if (y.p !== x.p) return y.p - x.p;

          }
        });
        if (yp !== xp) return yp - xp;
        if (ygd !== xgd) return ygd - xgd;
      }
      return ((y.ag - y.yg) - (x.ag - x.yg)) || (y.ag - x.ag);
    });

  window.downloadKrdStandingsPng = function() {
    if (typeof S === 'undefined' || !Array.isArray(S.teams)) return;
    const rows = getFullTable();

    const h = headH + (rows.length * rowH) + footH;

    const bg = ctx.createLinearGradient(0, 0, w, h);
    bg.addColorStop(0, '#090d16'); bg.addColorStop(1, '#111827');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);

      const duels = (S.matches || []).filter(m => m.played && ((m.home_id === idA && m.away_id === idB) || (m.home_id === idB && m.away_id === idA)));
      let wA = 0, wB = 0, dr = 0, gA = 0, gB = 0;
      duels.forEach(m => {
        const sA = m.home_id === idA ? m.hs : m.aws;
        const sB = m.home_id === idA ? m.aws : m.hs;
        gA += sA; gB += sB;
        if (sA > sB) wA++; else if (sB > sA) wB++; else dr++;
      });
      out.innerHTML = `

          <div><div style="font-size:11px;opacity:.75;">${nameB}</div><div style="font-size:20px;font-weight:900;color:#60a5fa;">${wB} G</div><div style="font-size:11px;opacity:.7;">${gB} Gol</div></div>
        </div>
        <div style="display:grid;gap:5px;margin-top:8px;">
          ${duels.length ? duels.map(m => {
            const hName = m.home_id === idA ? nameA : nameB;
            const aName = m.away_id === idA ? nameA : nameB;
            return `<div style="display:flex;justify-content:space-between;padding:5px 8px;background:rgba(30,41,59,0.5);border-radius:6px;font-size:12px;"><span>H${m.week} • ${hName} - ${aName}</span><b>${m.hs} - ${m.aws}</b></div>`;
          }).join('') : '<div style="font-size:12px;opacity:.7;text-align:center;padding:6px;">Bu iki rakip arasında henüz oynanmış maç yok.</div>'}
        </div>
      `;
    }

    selA.addEventListener('change', renderH2h);
    selB.addEventListener('change', renderH2h);
    renderH2h();
  }
  setInterval(mountTools, 1200);
})();
</script>

<script id="krd-nextgen-logic">
(function() {

      if (tsm) tsm.classList.remove('open');

        if (typeof story !== 'undefined' && story) { story = null; if (typeof render === 'function') render(); }
        if (typeof selTeam !== 'undefined' && selTeam) { selTeam = null; if (typeof render === 'function') render(); }
        if (typeof archView !== 'undefined' && archView) { archView = null; if (typeof render === 'function') render(); }
      } catch (err) {}
    }
  });

  function mountTitleOddsPanel() {
    if (typeof S === 'undefined' || !Array.isArray(S.teams) || S.teams.length < 2) return;
    var slug = (S.settings && S.settings.admin_slug) ? S.settings.admin_slug : 'krd-kontrol';
    if (location.hash.startsWith('#/yonetici') || location.hash.startsWith('#/' + slug)) return;

    var h2hBox = document.getElementById('krdH2hBox');
    if (!h2hBox || document.getElementById('krdOddsPanel')) return;

    var totalPerTeam = (S.teams.length - 1) * 2;
    var st = (typeof liveStandings === 'function') ? liveStandings().rows : [];
    if (!st.length) return;

    var leaderPts = st[0].pts;
    var fourthPts = st[Math.min(3, st.length - 1)].pts;

    var rowsHtml = st.map(function(t, i) {
      var rem = Math.max(0, totalPerTeam - (t.p || 0));
      var maxPts = t.pts + (rem * 3);
      var diffLeader = leaderPts - t.pts;
      var tagText = '';
      var tagColor = '#94a3b8';

      if (i === 0 && rem === 0) {
        tagText = '🏆 ŞAMPİYON'; tagColor = '#ffd23f';
      } else if (i === 0) {
        tagText = '👑 LİDER • Kontrol Elinde'; tagColor = '#22e08a';
      } else if (maxPts >= leaderPts) {
        tagText = '🔥 Şampiyonluk Potasında (-' + diffLeader + 'P)'; tagColor = '#38bdf8';
      } else if (maxPts >= fourthPts) {
        tagText = '⚔️ İlk 4 / Play-Off Yarışı'; tagColor = '#c084fc';
      } else {
        tagText = '🎯 Sıralama Mücadelesi'; tagColor = '#94a3b8';
      }

      return '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);flex-wrap:wrap;">' +
        '<div style="display:flex;align-items:center;gap:8px;">' +
          '<span style="font-weight:800;color:#94a3b8;min-width:22px;">#' + (i + 1) + '</span>' +
          '<b style="font-size:13.5px;">' + String(t.name).replace(/[<>&]/g, '') + '</b>' +
          '<span style="font-size:11.5px;color:#8fa0c8;">(' + t.pts + 'P • Kalan ' + rem + 'M • Tavan ' + maxPts + 'P)</span>' +
        '</div>' +
        '<span style="font-size:11.5px;font-weight:800;color:' + tagColor + ';">' + tagText + '</span>' +
      '</div>';
    }).join('');

    var panel = document.createElement('details');
    panel.id = 'krdOddsPanel';
    panel.className = 'card';
    panel.open = true;
    panel.style.marginTop = '12px';
    panel.innerHTML =
      '<summary style="cursor:pointer;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:space-between;gap:8px;">' +
        '<span>🎯 Canlı Şampiyonluk & Puan Tavanı Analizi</span>' +
        '<span class="tag" style="color:#22e08a;border:1px solid rgba(34,224,138,0.35);">CANLI HESAPLAMA</span>' +
      '</summary>' +
      '<div style="display:grid;gap:6px;margin-top:12px;">' + rowsHtml + '</div>';

    h2hBox.insertAdjacentElement('beforebegin', panel);
  }

  setInterval(mountTitleOddsPanel, 1300);
})();
</script>






<script id="krd-story-music-js">
(function() {
  if (document.getElementById('krdMusicDock')) return;

  var audio = window.__krdAudio = new Audio();
  audio.loop = false;
  audio.volume = Number(localStorage.getItem('krd_music_vol') || 0.65);

  var tracks = [];
  var idx = 0;
  var shuffleOn = localStorage.getItem('krd_music_shuffle') === '1';

  var dock = document.createElement('div');
  dock.id = 'krdMusicDock';
  dock.innerHTML =
    '<button type="button" id="krdMusPrev" title="Önceki Parça">⏮</button>' +
    '<button type="button" id="krdMusPlay" title="Oynat / Duraklat">🎵 Çal</button>' +
    '<button type="button" id="krdMusNext" title="Sonraki Parça">⏭</button>' +
    '<button type="button" id="krdMusShuffle" title="Karıştır (Aç/Kapat)">🔀</button>' +
    '<span id="krdMusicTitle" title="Şarkı Listesini Aç">Müzik Yükleniyor...</span>' +
    '<button type="button" id="krdMusListBtn" title="Şarkı Listesi">☰</button>' +
    '<label title="Cihazdan MP3 Seç" style="cursor:pointer;padding:4px 8px;border-radius:999px;background:rgba(34,224,138,0.18);border:1px solid rgba(34,224,138,0.4);font-size:11px;font-weight:700;color:#4ade80;display:inline-flex;align-items:center;">+ MP3<input type="file" id="krdMusFile" accept="audio/*" multiple style="display:none"></label>';
  document.body.appendChild(dock);

  var drawer = document.createElement('div');
  drawer.id = 'krdPlaylistDrawer';
  document.body.appendChild(drawer);

  var playBtn = document.getElementById('krdMusPlay');
  var titleEl = document.getElementById('krdMusicTitle');
  var prevBtn = document.getElementById('krdMusPrev');
  var nextBtn = document.getElementById('krdMusNext');
  var shufBtn = document.getElementById('krdMusShuffle');
  var listBtn = document.getElementById('krdMusListBtn');
  var fileIn = document.getElementById('krdMusFile');

  if (shuffleOn) shufBtn.classList.add('active');

  function renderDrawer() {
    if (!tracks.length) {
      drawer.innerHTML = '<div class="krd-pl-head"><span>🎶 Çalma Listesi (0)</span><span style="cursor:pointer" onclick="document.getElementById(\'krdPlaylistDrawer\').classList.remove(\'open\')">✕</span></div><div style="font-size:12px;color:#94a3b8;padding:8px;">Henüz parça yok.</div>';
      return;
    }
    var items = tracks.map(function(t, i) {
      var active = i === idx ? ' active' : '';
      var badge = i === idx ? (audio.paused ? '⏸' : '🔊') : (i + 1) + '.';
      return '<button type="button" class="krd-pl-item' + active + '" data-tidx="' + i + '"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + String(t.name || '').replace(/[<>&]/g, '') + '</span><span style="font-size:11px;opacity:.85;">' + badge + '</span></button>';
    }).join('');
    drawer.innerHTML = '<div class="krd-pl-head"><span>🎶 Şarkı Listesi (' + tracks.length + ' parça)</span><span style="cursor:pointer;padding:2px 6px;" onclick="document.getElementById(\'krdPlaylistDrawer\').classList.remove(\'open\')">✕</span></div>' + items;
    drawer.querySelectorAll('.krd-pl-item').forEach(function(btn) {
      btn.addEventListener('click', function() {
        loadAndPlay(Number(btn.getAttribute('data-tidx')), true);
      });
    });
  }

  function updateUi() {
    if (!tracks.length) {
      titleEl.textContent = 'Müzik Yok (+ MP3)';
      playBtn.textContent = '🎵 Çal';
      renderDrawer();
      return;
    }
    titleEl.textContent = tracks[idx].name;
    playBtn.textContent = audio.paused ? '▶️ Çal' : '⏸ Dur';
    renderDrawer();
  }

  function nextIndex(step) {
    if (!tracks.length) return 0;
    if (shuffleOn && tracks.length > 1) {
      var r = idx;
      while (r === idx) r = Math.floor(Math.random() * tracks.length);
      return r;
    }
    return (idx + step + tracks.length) % tracks.length;
  }

  function loadAndPlay(newIdx, autoPlay) {
    if (!tracks.length) return;
    idx = (newIdx + tracks.length) % tracks.length;
    audio.src = tracks[idx].url;
    if (autoPlay) {
      audio.play().then(updateUi).catch(function() {
        titleEl.textContent = 'Oynatılamadı (Tekrar Bas)';
        playBtn.textContent = '▶️ Çal';
        renderDrawer();
      });
    } else {
      updateUi();
    }
  }

  playBtn.addEventListener('click', function() {
    if (!tracks.length) { fileIn.click(); return; }
    if (!audio.src) { loadAndPlay(idx, true); return; }
    if (audio.paused) audio.play().then(updateUi).catch(updateUi);
    else { audio.pause(); updateUi(); }
  });

  prevBtn.addEventListener('click', function() { loadAndPlay(nextIndex(-1), true); });
  nextBtn.addEventListener('click', function() { loadAndPlay(nextIndex(1), true); });

  shufBtn.addEventListener('click', function() {
    shuffleOn = !shuffleOn;
    localStorage.setItem('krd_music_shuffle', shuffleOn ? '1' : '0');
    shufBtn.classList.toggle('active', shuffleOn);
  });

  function toggleDrawer() {
    renderDrawer();
    drawer.classList.toggle('open');
  }
  titleEl.addEventListener('click', toggleDrawer);
  listBtn.addEventListener('click', toggleDrawer);

  audio.addEventListener('ended', function() { loadAndPlay(nextIndex(1), true); });
  audio.addEventListener('play', updateUi);
  audio.addEventListener('pause', updateUi);

  fileIn.addEventListener('change', function() {
    var files = Array.from(fileIn.files || []);
    if (!files.length) return;
    files.forEach(function(f) {
      tracks.push({
        name: f.name.replace(/.[^.]+$/, ''),
        url: URL.createObjectURL(f)
      });
    });
    loadAndPlay(tracks.length - files.length, true);
  });

  fetch('/api/music-list')
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d && Array.isArray(d.tracks) && d.tracks.length) {
        tracks = d.tracks;
        loadAndPlay(0, false);
      } else {
        updateUi();
      }
    })
    .catch(updateUi);
})();
</script>

<script id="krd-chat-nojump-js">
(function() {
  var pinActive = false;
  var pinnedScrollY = 0;
  var pinTimer = null;

  function lockToChat(durationMs) {
    var cb = document.getElementById('krdChatBox');
    if (!cb) return;
    pinnedScrollY = window.scrollY;
    pinActive = true;
    clearTimeout(pinTimer);
    pinTimer = setTimeout(function() { pinActive = false; }, durationMs || 2200);
  }

  document.addEventListener('focusin', function(e) {
    if (e.target && e.target.id === 'krdChatInput') {
      setTimeout(function() { lockToChat(1500); }, 120);
    }
  }, true);

  document.addEventListener('submit', function(e) {

      lockToChat(2600);
      [0, 40, 120, 300, 650, 1200].forEach(function(ms) {
        setTimeout(function() {
          if (pinActive && Math.abs(window.scrollY - pinnedScrollY) > 20) {
            window.scrollTo({ top: pinnedScrollY, behavior: 'instant' });
          }
        }, ms);
      });
    }
  }, true);

  window.addEventListener('scroll', function() {

<script id="krd-pro-suite-js">
(function() {
  // 1. Tek tusla takimi ligden cekip kalan maclarini PUT /api/admin/matches/:id ile 3-0 hukmen yapma
  window.krdWithdrawTeamForfeit = async function() {
    var sel = document.getElementById('krdWithdrawTeamSel');
    if (!sel || !sel.value) { alert('Lütfen ligden çekilecek takımı seçin.'); return; }
    var tid = Number(sel.value);
    var team = (window.S && Array.isArray(S.teams)) ? S.teams.find(function(t) { return Number(t.id) === tid; }) : null;
    if (!team) return;

    var unplayed = (S.matches || []).filter(function(m) {
      return !m.played && (Number(m.home_id) === tid || Number(m.away_id) === tid);
    });
    if (!unplayed.length) {
      alert(team.name + ' takımının oynanmamış maçı kalmamış.');
      return;
    }
    if (!confirm(team.name + ' ligden çekilecek ve kalan ' + unplayed.length + ' maçı rakipleri lehine otomatik 3-0 HÜKMEN yazılacak. Onaylıyor musunuz?')) return;

    var btn = document.getElementById('krdWithdrawBtn');
    if (btn) { btn.disabled = true; btn.textContent = 'İşleniyor (' + unplayed.length + ' maç)...'; }

    try {
      for (var i = 0; i < unplayed.length; i++) {
        var m = unplayed[i];
        var isHome = Number(m.home_id) === tid;
        var payload = {
          hs: isHome ? 0 : 3,
          aws: isHome ? 3 : 0,
          played: 1,
          note: 'Hükmen 3-0 (' + team.name + ' ligden çekildi)'
        };
        await api('PUT', '/api/admin/matches/' + m.id, payload);
      }
      await load();

    } catch (err) {
      alert('Hükmen işleminde hata oluştu: ' + (err && err.message ? err.message : err));
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = '🚫 Kalan Maçları 3-0 Hükmen Yap'; }

  };

  // 2. Tek tikla tam JSON yedek indirme
  window.krdDownloadBackupJson = function() {
    if (!window.S && typeof S !== "undefined") window.S = S;
    var payload = {
      exported_at: new Date().toISOString(),
      settings: S.settings || {},
      teams: S.teams || [],
      matches: S.matches || [],
      goals: S.goals || []
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'kardesler-ligi-yedek-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a);
    a.click();
    setTimeout(function() { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  };

  // 3. Yonetici duyuru bandini kaydetme / temizleme
  window.krdSaveAdminBanner = function(clear) {
    var inp = document.getElementById('krdBannerInp');
    if (clear) {
      localStorage.removeItem('krd_custom_banner');
      if (inp) inp.value = '';
    } else if (inp) {
      var val = inp.value.trim();
      if (val) localStorage.setItem('krd_custom_banner', val);
      else localStorage.removeItem('krd_custom_banner');
    }
    syncProSuite();
  };

  function isLoggedInAdminPanel() {
    if (typeof ME === 'undefined' || !ME || !ME.admin) return false;
    var slug = (typeof S !== 'undefined' && S && S.settings && S.settings.admin_slug) ? S.settings.admin_slug : 'krd-kontrol';
    var h = location.hash || '';
    return h.startsWith('#/' + slug) || h.startsWith('#/yonetici-gizli');
  }

  function syncProSuite() {
    var app = document.getElementById('app');
    if (!app) return;

    var onAdminPanel = isLoggedInAdminPanel();

    // A. Puan tablosu 1. siraya altin tac ikonu ekle (sadece ana sayfada)
    if (!onAdminPanel) {
      var firstTeamLink = app.querySelector('.card.tw tbody tr:first-child .tlink');
      if (firstTeamLink && !firstTeamLink.querySelector('.krd-leader-crown')) {
        var cr = document.createElement('span');

        cr.textContent = '👑';
        firstTeamLink.appendChild(cr);

      // B. Siradaki maclardaki oy butonlarina animasyonlu yuzde bari ekle
      app.querySelectorAll('button').forEach(function(btn) {
        var m = (btn.textContent || '').match(/(%(d+))/);
        if (m) {
          var pct = Math.min(100, Math.max(0, Number(m[1])));
          var bar = btn.querySelector('.krd-vote-bar');
          if (!bar) {
            bar = document.createElement('span');
            bar.className = 'krd-vote-bar';
            bar.innerHTML = '<i style="width:' + pct + '%"></i>';
            btn.appendChild(bar);
          } else {
            var fill = bar.querySelector('i');
            if (fill && fill.style.width !== pct + '%') fill.style.width = pct + '%';
          }
        }

    // C. Tekrarlanan alttaki H2H Ac/Kapat kutusunu gizle
    document.querySelectorAll('div, section, details').forEach(function(el) {
      var txt = (el.textContent || '').trim();
      if (txt.indexOf('Kafa Kafaya (H2H) Rekabet & PNG Tablo İndir') !== -1 && el.offsetHeight > 0 && el.offsetHeight < 140) {
        el.style.display = 'none';

    // D. Tarihi farkli skor kutularini (5+ fark) vurgula
    document.querySelectorAll('#app .grid > div').forEach(function(card) {
      var m = (card.textContent || '').match(/(d+)s*-s*(d+)/);
      if (m && Math.abs(Number(m[1]) - Number(m[2])) >= 5) {
        card.querySelectorAll('div, span').forEach(function(el) {
          if (/^s*d+s*-s*d+s*$/.test(el.textContent || '')) {
            el.classList.add('krd-historic-score');

    });

    // E. Tahmin Krali tablosunda mobilde Puan sutununu gorunur tut
    document.querySelectorAll('#app table').forEach(function(tbl) {
      var ths = tbl.querySelectorAll('thead th');
      if (ths.length >= 6 && (tbl.querySelector('thead').textContent || '').indexOf('Tahminci') !== -1 && window.innerWidth < 540) {
        tbl.querySelectorAll('tr').forEach(function(tr) {
          if (tr.children[3]) tr.children[3].style.display = 'none';
          if (tr.children[4]) tr.children[4].style.display = 'none';
          if (tr.children[5]) {
            tr.children[5].style.display = 'table-cell';
            tr.children[5].style.color = '#fde68a';
            tr.children[5].style.fontWeight = '800';
          }
        });
      }
    });

    // F. Yonetici Duyuru Bandi (sadece yonetici metin girdiyse goster)
    var bannerText = localStorage.getItem('krd_custom_banner') || '';
    var existingBanner = document.getElementById('krdAdminBanner');
    if (bannerText) {
      if (!existingBanner) {
        var b = document.createElement('div');
        b.id = 'krdAdminBanner';
        b.innerHTML = '<span>📢</span><span></span>';
        app.insertBefore(b, app.firstChild);
        existingBanner = b;
      }
      if (existingBanner.children[1].textContent !== bannerText) {
        existingBanner.children[1].textContent = bannerText;
      }
    } else if (existingBanner) {
      existingBanner.remove();
    }

    
  }

  syncProSuite();
  setInterval(syncProSuite, 450);
})();
</script>
<script id="krd-cyber-admin-js">
(function() {
  var matrixTimer = null;

  function isAdminRoute() {
    var slug = (typeof S !== 'undefined' && S && S.settings && S.settings.admin_slug) ? S.settings.admin_slug : 'krd-kontrol';
    var h = location.hash || '';
    return h.startsWith('#/' + slug) || h.startsWith('#/yonetici-gizli');
  }

  function startMatrixRain() {
    var canvas = document.getElementById('krdCyberMatrixCanvas');
    if (!canvas) {
      canvas = document.createElement('canvas');
      canvas.id = 'krdCyberMatrixCanvas';
      document.body.prepend(canvas);
    }
    if (matrixTimer) return;
    var ctx = canvas.getContext('2d');
    var chars = '01アイウエオカキクケコKRD$#@%*+=-<>[]{}';
    var fontSize = 13;
    var columns = 0;
    var drops = [];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      columns = Math.floor(canvas.width / fontSize);
      drops = Array(columns).fill(1).map(function() { return Math.floor(Math.random() * 25); });
    }
    resize();
    window.addEventListener('resize', resize);

    matrixTimer = setInterval(function() {
      if (!document.body.classList.contains('krd-cyber-admin')) return;
      ctx.fillStyle = 'rgba(3, 7, 6, 0.09)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#00ff88';
      ctx.font = fontSize + 'px monospace';
      for (var i = 0; i < drops.length; i++) {
        var text = chars.charAt(Math.floor(Math.random() * chars.length));
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }, 65);
  }

  function stopMatrixRain() {
    if (matrixTimer) {
      clearInterval(matrixTimer);
      matrixTimer = null;
    }
    var canvas = document.getElementById('krdCyberMatrixCanvas');
    if (canvas) canvas.remove();
  }

  function syncCyberAdminTheme() {
    var active = isAdminRoute();
    var app = document.getElementById('app');

    if (!active) {
      if (document.body.classList.contains('krd-cyber-admin')) {
        document.body.classList.remove('krd-cyber-admin');
      }
      var oldHud = document.getElementById('krdCyberHudBar');
      if (oldHud) oldHud.remove();
      stopMatrixRain();
      return;
    }

    if (!document.body.classList.contains('krd-cyber-admin')) {
      document.body.classList.add('krd-cyber-admin');
    }
    startMatrixRain();

    if (app) {
      var hud = document.getElementById('krdCyberHudBar');
      var isAuth = (typeof ME !== 'undefined' && ME && ME.admin);
      var nowStr = new Date().toTimeString().slice(0, 8);
      if (!hud) {
        hud = document.createElement('div');
        hud.id = 'krdCyberHudBar';
        app.prepend(hud);
      }
      hud.innerHTML =
        '<div class="hud-left">' +
          '<span class="hud-dot"></span>' +
          '<span>' + (isAuth ? ('root@' + ((ME && ME.username) || 'krd-league') + ':~/command-center#') : 'AUTH://GATEWAY-LOCKED') + '</span>' +
        '</div>' +
        '<div class="hud-tags">' +
          '<span class="hud-tag">' + (isAuth ? 'ACCESS: GRANTED' : 'SEC: TLS-256') + '</span>' +
          '<span class="hud-tag">NODE: TR-IST</span>' +
          '<span class="hud-tag">SYS: ' + nowStr + '</span>' +
        '</div>';
    }
  }

  syncCyberAdminTheme();
  setInterval(syncCyberAdminTheme, 1000);
  window.addEventListener('hashchange', syncCyberAdminTheme);
})();
</script>
<script id="krd-home-radar-js">
(function() {
  function escH(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
  }

  function renderHomeRadar() {
    var slug = (typeof S !== 'undefined' && S && S.settings && S.settings.admin_slug) ? S.settings.admin_slug : 'krd-kontrol';
    var h = location.hash || '';
    var isAdmin = h.startsWith('#/' + slug) || h.startsWith('#/yonetici-gizli');
    var existing = document.getElementById('krdHomeRadarWrap');

    if (isAdmin || typeof S === 'undefined' || !S || !Array.isArray(S.teams) || !Array.isArray(S.matches)) {
      if (existing) existing.remove();
      return;
    }

    var app = document.getElementById('app');
    if (!app) return;

    var teams = S.teams || [];
    var matches = S.matches || [];
    var goals = S.goals || [];
    var played = matches.filter(function(m) { return !!m.played; });

    // 1. Lig Ozeti & Rekorlar Seridi
    var totalGoals = 0;
    var teamStats = {};
    teams.forEach(function(t) {
      teamStats[t.id] = { id: t.id, name: t.name, gf: 0, ga: 0, p: 0 };
    });

    played.forEach(function(m) {
      var hg = Number(m.home_goals || 0);
      var ag = Number(m.away_goals || 0);
      totalGoals += (hg + ag);
      if (teamStats[m.home_id]) {
        teamStats[m.home_id].gf += hg;
        teamStats[m.home_id].ga += ag;
        teamStats[m.home_id].p += 1;
      }
      if (teamStats[m.away_id]) {
        teamStats[m.away_id].gf += ag;
        teamStats[m.away_id].ga += hg;
        teamStats[m.away_id].p += 1;
      }
    });

    var avgGoals = played.length ? (totalGoals / played.length).toFixed(2) : '0.00';
    var statArr = Object.values(teamStats);

    var bestAttack = statArr.slice().sort(function(a, b) { return b.gf - a.gf; })[0];
    var playedTeams = statArr.filter(function(x) { return x.p > 0; });
    var bestDefense = playedTeams.slice().sort(function(a, b) {
      return (a.ga / a.p) - (b.ga / b.p) || a.ga - b.ga;
    })[0];

    // 2. Haftanin Takimi (Son oynanan haftanin en farkli galibi)
    var teamOfWeekName = 'Henüz maç yok';
    var teamOfWeekSub = 'İlk maçların oynanması bekleniyor';
    if (played.length) {
      var maxWeek = played.reduce(function(mx, m) { return Math.max(mx, Number(m.week || 1)); }, 1);
      var weekMatches = played.filter(function(m) { return Number(m.week || 1) === maxWeek; });
      var bestDiff = -1;
      var bestGf = -1;
      weekMatches.forEach(function(m) {
        var hg = Number(m.home_goals || 0);
        var ag = Number(m.away_goals || 0);
        var diff = Math.abs(hg - ag);
        if (hg > ag && (diff > bestDiff || (diff === bestDiff && hg > bestGf))) {
          bestDiff = diff;
          bestGf = hg;
          var ht = teamStats[m.home_id];
          var at = teamStats[m.away_id];
          teamOfWeekName = ht ? ht.name : 'Ev Sahibi';
          teamOfWeekSub = 'H' + maxWeek + ' • ' + (at ? at.name : 'Rakip') + ' karşısında ' + hg + '-' + ag + ' zafer';
        } else if (ag > hg && (diff > bestDiff || (diff === bestDiff && ag > bestGf))) {
          bestDiff = diff;
          bestGf = ag;
          var ht2 = teamStats[m.home_id];
          var at2 = teamStats[m.away_id];
          teamOfWeekName = at2 ? at2.name : 'Deplasman';
          teamOfWeekSub = 'H' + maxWeek + ' • ' + (ht2 ? ht2.name : 'Rakip') + ' deplasmanında ' + ag + '-' + hg + ' zafer';
        }
      });
      if (bestDiff === -1 && weekMatches[0]) {
        var wm = weekMatches[0];
        var t1 = teamStats[wm.home_id];
        teamOfWeekName = t1 ? t1.name : 'Hafta ' + maxWeek;
        teamOfWeekSub = 'H' + maxWeek + ' • Mücadeleci beraberlik (' + wm.home_goals + '-' + wm.away_goals + ')';
      }
    }

    // 3. Gol Krali Vitrini
    var topScorerName = 'Veri bekleniyor';
    var topScorerSub = 'Oyuncu gol istatistiği girilmedi';
    if (goals.length) {
      var pMap = {};
      goals.forEach(function(g) {
        var key = (g.player || '').trim();
        if (!key) return;
        if (!pMap[key]) pMap[key] = { name: key, g: 0, a: 0, tid: g.team_id };
        pMap[key].g += Number(g.goals || 0);
        pMap[key].a += Number(g.assists || 0);
      });
      var topP = Object.values(pMap).sort(function(a, b) { return (b.g - a.g) || (b.a - a.a); })[0];
      if (topP) {
        var club = teamStats[topP.tid];
        topScorerName = topP.name + (club ? ' (' + club.name + ')' : '');
        topScorerSub = '⚽ ' + topP.g + ' Gol • 🎯 ' + topP.a + ' Asist';
      }
    } else if (bestAttack && bestAttack.gf > 0) {
      topScorerName = bestAttack.name;

<script id="krd-derby-form-js">
(function() {
  function escD(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
  }

  function computeTeamForms() {
    var teams = (typeof S !== 'undefined' && S && S.teams) ? S.teams : [];
    var matches = (typeof S !== 'undefined' && S && S.matches) ? S.matches : [];
    var played = matches.filter(function(m) { return !!m.played; })
      .slice()
      .sort(function(a, b) { return (Number(a.week || 1) - Number(b.week || 1)) || (Number(a.id || 0) - Number(b.id || 0)); });

    var map = {};
    teams.forEach(function(t) {
      map[t.id] = { id: t.id, name: t.name, color: t.color || '#38bdf8', pts: 0, gd: 0, gf: 0, form: [], winStreak: 0 };
    });

    played.forEach(function(m) {
      var hg = Number(m.home_goals || 0);
      var ag = Number(m.away_goals || 0);
      var h = map[m.home_id];
      var a = map[m.away_id];
      if (h) {
        h.gf += hg; h.gd += (hg - ag);
        if (hg > ag) { h.pts += 3; h.form.push('W'); }
        else if (hg === ag) { h.pts += 1; h.form.push('D'); }
        else { h.form.push('L'); }
      }
      if (a) {
        a.gf += ag; a.gd += (ag - hg);
        if (ag > hg) { a.pts += 3; a.form.push('W'); }
        else if (ag === hg) { a.pts += 1; a.form.push('D'); }
        else { a.form.push('L'); }
      }
    });

    Object.values(map).forEach(function(t) {
      var st = 0;
      for (var i = t.form.length - 1; i >= 0; i--) {
        if (t.form[i] === 'W') st++;
        else break;
      }
      t.winStreak = st;
      t.last5 = t.form.slice(-5);
    });

    var ranked = Object.values(map).sort(function(a, b) {
      return (b.pts - a.pts) || (b.gd - a.gd) || (b.gf - a.gf);
    });
    ranked.forEach(function(t, idx) { t.rank = idx + 1; });
    return map;
  }

  function enhanceHomeDerbyAndForms() {
    var slug = (typeof S !== 'undefined' && S && S.settings && S.settings.admin_slug) ? S.settings.admin_slug : 'krd-kontrol';
    var h = location.hash || '';
    var isAdmin = h.startsWith('#/' + slug) || h.startsWith('#/yonetici-gizli');
    if (isAdmin || typeof S === 'undefined' || !S || !Array.isArray(S.teams)) return;

    var formMap = computeTeamForms();

    // 1. Haftanin Derbi Vitrini (Radar kutusunun icine en kritik oynanmamis maci ekle)
    var radarWrap = document.getElementById('krdHomeRadarWrap');
    if (radarWrap) {
      var unplayed = (S.matches || []).filter(function(m) { return !m.played; });
      var derbyBox = document.getElementById('krdDerbyShowcase');
      if (unplayed.length) {
        // Siralama toplami en kucuk (zirveye en yakin) maci sec
        var bestMatch = unplayed.slice().sort(function(m1, m2) {
          var r1 = ((formMap[m1.home_id] && formMap[m1.home_id].rank) || 99) + ((formMap[m1.away_id] && formMap[m1.away_id].rank) || 99);
          var r2 = ((formMap[m2.home_id] && formMap[m2.home_id].rank) || 99) + ((formMap[m2.away_id] && formMap[m2.away_id].rank) || 99);
          return r1 - r2;
        })[0];

        var ht = formMap[bestMatch.home_id];
        var at = formMap[bestMatch.away_id];
        if (ht && at) {
          if (!derbyBox) {
            derbyBox = document.createElement('div');
            derbyBox.id = 'krdDerbyShowcase';
            derbyBox.className = 'krd-derby-box';
            radarWrap.appendChild(derbyBox);
          }
          derbyBox.innerHTML =
            '<div class="krd-derby-top">' +
              '<span>🔥 HAFTANIN DEV MAÇI (DERBİ VİTRİNİ)</span>' +
              '<span>Hafta ' + (bestMatch.week || 1) + ' • #' + ht.rank + ' vs #' + at.rank + '</span>' +
            '</div>' +
            '<div class="krd-derby-teams">' +
              '<div class="krd-derby-side">' +
                '<span class="krd-derby-dot" style="color:' + escD(ht.color) + ';background:' + escD(ht.color) + '"></span>' +
                '<span>' + escD(ht.name) + ' <small style="color:#94a3b8;font-weight:600">(#' + ht.rank + ')</small></span>' +
              '</div>' +
              '<div class="krd-derby-vs">VS</div>' +
              '<div class="krd-derby-side away">' +
                '<span><small style="color:#94a3b8;font-weight:600">(#' + at.rank + ')</small> ' + escD(at.name) + '</span>' +
                '<span class="krd-derby-dot" style="color:' + escD(at.color) + ';background:' + escD(at.color) + '"></span>' +
              '</div>' +
            '</div>';
        }
      } else if (derbyBox) {
        derbyBox.remove();
      }
    }

    // 2. Puan tablosu satirlarina Son 5 Mac Formu (G-B-M) & Seri Rozeti ekle
    var rows = document.querySelectorAll('table tbody tr');
    rows.forEach(function(tr) {
      if (tr.dataset.krdFormDone === '1') return;
      var txt = tr.textContent || '';
      var matchedTeam = Object.values(formMap).find(function(t) {
        return t.name && txt.indexOf(t.name) !== -1;
      });
      if (!matchedTeam || !matchedTeam.last5 || !matchedTeam.last5.length) return;

      var cells = tr.querySelectorAll('td');
      var nameCell = cells[1] || cells[0];
      if (!nameCell) return;

      var dotsHtml = '<span class="krd-form-dots" title="Son 5 Maç Formu">' +
        matchedTeam.last5.map(function(res) {
          var lbl = res === 'W' ? 'G' : (res === 'D' ? 'B' : 'M');
          return '<span class="krd-fdot ' + res + '">' + lbl + '</span>';
        }).join('') +
      '</span>';

      var streakHtml = matchedTeam.winStreak >= 3
        ? '<span class="krd-streak-badge" title="' + matchedTeam.winStreak + ' maç üst üste galibiyet">🔥 ' + matchedTeam.winStreak + ' Seri</span>'
        : '';

      nameCell.insertAdjacentHTML('beforeend', dotsHtml + streakHtml);
      tr.dataset.krdFormDone = '1';
    });
  }

  enhanceHomeDerbyAndForms();
  setInterval(enhanceHomeDerbyAndForms, 1500);
  window.addEventListener('hashchange', enhanceHomeDerbyAndForms);
})();
</script>

                '<div class="row" style="margin-top:6px"><select id="cl_sf1_h">' + teamOpts(cfg.sf1_h, 'Ev Sahibi') + '</select><input id="cl_sf1_hs" value="' + escCl(cfg.sf1_hs || '') + '" placeholder="Skor" style="max-width:70px"></div>' +
                '<div class="row" style="margin-top:6px"><select id="cl_sf1_a">' + teamOpts(cfg.sf1_a, 'Deplasman') + '</select><input id="cl_sf1_as" value="' + escCl(cfg.sf1_as || '') + '" placeholder="Skor" style="max-width:70px"></div>' +
              '</div>' +
              '<div class="card" style="margin:0"><b>2. Yarı Final (Manuel Takım & Skor)</b>' +
                '<div class="row" style="margin-top:6px"><select id="cl_sf2_h">' + teamOpts(cfg.sf2_h, 'Ev Sahibi') + '</select><input id="cl_sf2_hs" value="' + escCl(cfg.sf2_hs || '') + '" placeholder="Skor" style="max-width:70px"></div>' +
                '<div class="row" style="margin-top:6px"><select id="cl_sf2_a">' + teamOpts(cfg.sf2_a, 'Deplasman') + '</select><input id="cl_sf2_as" value="' + escCl(cfg.sf2_as || '') + '" placeholder="Skor" style="max-width:70px"></div>' +
              '</div>' +
              '<div class="card" style="margin:0"><b>🏆 Büyük Final & Şampiyon</b>' +
                '<div class="row" style="margin-top:6px"><select id="cl_fin_h">' + teamOpts(cfg.fin_h, 'Finalist 1') + '</select><input id="cl_fin_hs" value="' + escCl(cfg.fin_hs || '') + '" placeholder="Skor" style="max-width:70px"></div>' +
                '<div class="row" style="margin-top:6px"><select id="cl_fin_a">' + teamOpts(cfg.fin_a, 'Finalist 2') + '</select><input id="cl_fin_as" value="' + escCl(cfg.fin_as || '') + '" placeholder="Skor" style="max-width:70px"></div>' +
                '<div style="margin-top:6px"><select id="cl_champ">' + teamOpts(cfg.champ, '👑 Şampiyon Takımı Seç') + '</select></div>' +
              '</div>' +
            '</div>' +
            '<button type="button" class="pri" id="cl_save_btn">💾 KRD Şampiyonlar Ligi Ayarlarını Kaydet</button>' +
          '</div>';
        app.appendChild(box);
        document.getElementById('cl_save_btn').addEventListener('click', async () => {
          const payload = {
            enabled: document.getElementById('cl_enabled').checked,
            title: document.getElementById('cl_title').value.trim() || 'KRD ŞAMPİYONLAR LİGİ',
            mode: document.getElementById('cl_mode').value,
            note: document.getElementById('cl_note').value.trim(),
            sf1_h: document.getElementById('cl_sf1_h').value,
            sf1_hs: document.getElementById('cl_sf1_hs').value.trim(),
            sf1_a: document.getElementById('cl_sf1_a').value,
            sf1_as: document.getElementById('cl_sf1_as').value.trim(),
            sf2_h: document.getElementById('cl_sf2_h').value,
            sf2_hs: document.getElementById('cl_sf2_hs').value.trim(),
            sf2_a: document.getElementById('cl_sf2_a').value,
            sf2_as: document.getElementById('cl_sf2_as').value.trim(),
            fin_h: document.getElementById('cl_fin_h').value,
            fin_hs: document.getElementById('cl_fin_hs').value.trim(),
            fin_a: document.getElementById('cl_fin_a').value,
            fin_as: document.getElementById('cl_fin_as').value.trim(),
            champ: document.getElementById('cl_champ').value
          };
          try {
            await api('POST', '/api/admin/krd-extras', { cl: payload });
            window.__krdClCfg = payload;
            if (typeof toast === 'function') toast('KRD Şampiyonlar Ligi ayarları kaydedildi!');
          } catch (err) {
            alert('Kaydedilemedi: ' + (err.message || err));
          }
        });
      }
      return;
    }

    // Ana Sayfa: Renkli & Animasyonlu Menuleri Olustur ("Tumu" YOK!)
    const hero = app.querySelector('.hero');
    if (!hero) return;

    const clEnabled = !!(window.__krdClCfg && window.__krdClCfg.enabled);
    if (!clEnabled && activeMainMenu === 'cl') activeMainMenu = 'puan';

    let navBar = document.getElementById('krdColoredMainNav');
    if (!navBar) {
      navBar = document.createElement('div');
      navBar.id = 'krdColoredMainNav';
      hero.insertAdjacentElement('afterend', navBar);
    }

    const menuItems = [
      { id: 'puan', icon: '📊', label: 'Puan Durumu' },
      { id: 'maclar', icon: '⚽', label: 'Maçlar & Fikstür' },
      { id: 'istatistik', icon: '📈', label: 'İstatistik & Rekabet' },
      { id: 'muze', icon: '🏆', label: 'Şampiyonlar Müzesi' }
    ];
    if (clEnabled) {
      menuItems.push({ id: 'cl', icon: '🌟', label: 'KRD ŞAMPİYONLAR LİGİ' });
    }

    const sig = menuItems.map(m => m.id).join(',') + '|' + activeMainMenu;
    if (navBar.dataset.sig !== sig) {
      navBar.dataset.sig = sig;
      navBar.innerHTML = menuItems.map(m =>
        '<button type="button" class="krd-mnav-btn ' + (activeMainMenu === m.id ? 'active' : '') + '" data-nav="' + m.id + '">' +
          '<span>' + m.icon + '</span><span>' + m.label + '</span>' +
        '</button>'
      ).join('');
      navBar.querySelectorAll('.krd-mnav-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          activeMainMenu = btn.getAttribute('data-nav');
          localStorage.setItem('krd_active_main_menu', activeMainMenu);
          syncColoredMenusAndCl();
        });
      });
    }

    // Icerik bolumlerini secili menuye gore siniflandir ve animasyonla goster/gizle
    let currentBucket = 'puan';
    Array.from(app.children).forEach(el => {
      if (el === hero || el === navBar || el.classList.contains('modal')) return;
      if (el.id === 'krdChampionsLeagueSection') return;

      const txt = (el.textContent || '');
      if (el.classList.contains('sh')) {
        if (/Puan Durumu/i.test(txt)) currentBucket = 'puan';
        else if (/Gol & Asist|Kafa Kafaya|Tahmin Kralı|Kupa / Play-Off/i.test(txt)) currentBucket = 'istatistik';
        else if (/Maçlar & Fikstür|Son Maçlar|Sıradaki Maçlar/i.test(txt)) currentBucket = 'maclar';
        else if (/Şampiyonlar Müzesi/i.test(txt)) currentBucket = 'muze';
      }
      if (el.id === 'krdHomeRadarWrap' || el.id === 'krdAdminBanner') {
        el.style.display = (activeMainMenu === 'puan') ? '' : 'none';
        return;
      }
      if (el.id === 'krdOddsPanel' || el.id === 'krdH2hBox') {
        el.style.display = (activeMainMenu === 'istatistik') ? '' : 'none';
        return;
      }

      const show = (activeMainMenu !== 'cl') && (currentBucket === activeMainMenu);
      if (show) {
        if (el.style.display === 'none') {
          el.style.display = '';
          el.classList.remove('krd-nav-pane-anim');
          void el.offsetWidth;
          el.classList.add('krd-nav-pane-anim');
        }
      } else {
        el.style.display = 'none';
      }
    });

    // KRD Sampiyonlar Ligi Sahnesi
    let clSec = document.getElementById('krdChampionsLeagueSection');
    if (activeMainMenu === 'cl' && clEnabled) {
      if (!clSec) {
        clSec = document.createElement('div');
        clSec.id = 'krdChampionsLeagueSection';
        navBar.insertAdjacentElement('afterend', clSec);
      }
      clSec.innerHTML = renderChampionsLeagueView();
    } else if (clSec) {
      clSec.remove();
    }
  }

  fetchClCfg();
  setInterval(fetchClCfg, 15000);
  setInterval(syncColoredMenusAndCl, 350);
  window.addEventListener('hashchange', syncColoredMenusAndCl);
})();
</script>
</body></html>
