<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kardeşler Ligi</title>
<style>
:root{--bg:#070b16;--card:#111a2e;--card2:#16223c;--line:#24345a;--tx:#eaf0ff;--mut:#8fa0c8;--g:#22e08a;--y:#ffd23f;--r:#ff4d6d;--b:#4da3ff}
*{box-sizing:border-box}body{margin:0;font:16px/1.4 system-ui,Segoe UI,Roboto,sans-serif;color:var(--tx);background:radial-gradient(1200px 600px at 80% -10%,#1b3a8a55,transparent),radial-gradient(900px 500px at -10% 10%,#0e8f5a44,transparent),var(--bg);min-height:100vh}
a{color:inherit}.wrap{max-width:1000px;margin:auto;padding:16px}
.hero{padding:28px 20px;border-radius:22px;background:linear-gradient(120deg,#0f7a4f,#1a47c9 60%,#6a2bd9);position:relative;overflow:hidden;animation:in .6s both}
.hero:after{content:"⚽";position:absolute;right:-10px;top:-20px;font-size:150px;opacity:.15;animation:spin 14s linear infinite}
.hero h1{margin:0;font-size:clamp(26px,6vw,42px);letter-spacing:.5px}.hero p{margin:6px 0 0;opacity:.9}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.chip{background:#ffffff26;padding:4px 12px;border-radius:99px;font-size:13px;backdrop-filter:blur(4px)}
.sh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:26px 0 10px;flex-wrap:wrap}
h2{margin:0;font-size:18px;display:flex;align-items:center;gap:8px}h2:before{content:"";width:5px;height:20px;border-radius:3px;background:var(--g)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;animation:in .5s both}
.stats{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));margin-top:14px}
.st{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.st small{display:block;color:var(--mut);font-size:12px;margin-bottom:4px}.st b{font-size:14px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:620px}th{font-size:12px;color:var(--mut);text-align:center;padding:8px 6px;font-weight:600}td{padding:10px 6px;text-align:center;border-top:1px solid var(--line)}
td.n,th.n{text-align:left}tbody tr{animation:row .5s both}tbody tr:hover{background:var(--card2)}.pts{font-weight:800;color:var(--g);font-size:17px}
.tlink{cursor:pointer;display:inline-flex;align-items:center;font-weight:600}.tlink:hover{color:var(--g)}
.mv{font-size:11px;font-weight:800;margin-left:4px}.mv.up{color:var(--g)}.mv.dn{color:var(--r)}
.live-banner{background:#ff4d6d1f;border:1px solid #ff4d6d55;color:#ffb3c1;padding:8px 12px;border-radius:12px;font-size:13px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.form{display:inline-flex;gap:3px;justify-content:center}.fb{width:19px;height:19px;border-radius:5px;display:inline-grid;place-items:center;font-size:10px;font-weight:800}
.fb.G{background:#22e08a26;color:var(--g);border:1px solid #22e08a55}.fb.B{background:#ffd23f26;color:var(--y);border:1px solid #ffd23f55}.fb.M{background:#ff4d6d26;color:var(--r);border:1px solid #ff4d6d55}
.pos{width:26px;height:26px;display:inline-grid;place-items:center;border-radius:8px;background:var(--card2);font-weight:700;font-size:13px}tr:nth-child(1) .pos{background:var(--y);color:#222}
.b{display:inline-grid;place-items:center;min-width:34px;height:34px;padding:0 4px;border-radius:50%;background:var(--c);color:#fff;font-weight:800;font-size:11px;box-shadow:0 0 0 3px #ffffff18,0 4px 14px color-mix(in srgb,var(--c) 50%,transparent);vertical-align:middle;margin-right:8px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.m{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;background:var(--card2);border-radius:14px;padding:12px;animation:in .5s both;transition:transform .2s;position:relative}.m:hover{transform:translateY(-3px)}
.m .t{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;text-align:center}.m .t .b{margin:0;width:44px;height:44px;font-size:13px}
.sc{font-size:28px;font-weight:900;letter-spacing:2px;min-width:80px;text-align:center}.sc small{display:block;font-size:11px;font-weight:600;color:var(--mut);letter-spacing:0}.sc.pop span{display:inline-block;animation:pop .6s}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:#ffffff14;color:var(--mut)}.tag.live{background:#ff4d6d33;color:var(--r);animation:blink 1.2s infinite}
.pbtn{position:absolute;top:7px;right:7px;padding:3px 7px;font-size:11px;border-radius:7px;opacity:.75}
.h2h-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;text-align:center;margin-top:12px;padding:12px;background:var(--card2);border-radius:14px}
.h2h-mid{display:grid;gap:6px}.h2h-nums{display:flex;gap:12px;justify-content:center;font-weight:900;font-size:22px}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:9px 14px;background:var(--card2);transition:.15s;border:1px solid var(--line)}button:hover{filter:brightness(1.25);transform:translateY(-1px)}button:active{transform:scale(.95)}
.sm{padding:6px 11px;font-size:13px}
.pri{background:linear-gradient(90deg,#14b36b,#1f6fe0);border:0;font-weight:700}.dng{background:#ff4d6d22;color:var(--r);border-color:#ff4d6d55}
.gb{width:42px;height:42px;font-size:22px;font-weight:900;padding:0;border-radius:50%}.gb.plus{background:#22e08a22;color:var(--g);border-color:#22e08a66}
input,select{background:#0b1226;border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}input[type=color]{padding:2px;height:40px;width:56px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1 1 120px}.row>button{flex:0 0 auto}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:14px 0}.tabs button{white-space:nowrap}.tabs .on{background:var(--g);color:#052;font-weight:800;border-color:var(--g)}
.ctr{display:flex;gap:6px;align-items:center;justify-content:center;margin-top:8px}.mc{grid-column:1/-1;display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-top:4px}
.login{max-width:380px;margin:12vh auto}.login .card{padding:22px;display:grid;gap:12px}label{font-size:13px;color:var(--mut);display:grid;gap:4px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;flex-wrap:wrap}.mut{color:var(--mut);font-size:13px}.empty{text-align:center;color:var(--mut);padding:24px}
.modal{position:fixed;inset:0;background:#030610dd;backdrop-filter:blur(6px);display:grid;place-items:center;padding:14px;z-index:10;overflow-y:auto}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:18px;max-width:620px;width:100%;max-height:88vh;overflow-y:auto;padding:18px;animation:in .25s both}
.story{width:min(360px,92vw);aspect-ratio:9/16;background:radial-gradient(circle at 20% 10%,#199c6355,transparent 55%),radial-gradient(circle at 85% 90%,#2557d666,transparent 55%),#080e1f;border:2px solid #ffffff26;border-radius:26px;padding:22px 18px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 20px 60px #000a;position:relative}
.story-head{text-align:center}.story-head h3{margin:4px 0 2px;font-size:22px;letter-spacing:.4px}.story-sub{font-size:12px;color:var(--mut)}
.story-row{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:12px;background:#ffffff0d;margin-bottom:6px;font-size:14px}
.story-match{text-align:center;padding:18px 10px;background:#ffffff0d;border-radius:20px;border:1px solid #ffffff1a}
.story-teams{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin:14px 0}
.story-foot{text-align:center;font-size:11px;color:var(--mut);letter-spacing:1px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:#16223c;border:1px solid var(--g);padding:10px 18px;border-radius:12px;transition:.3s;z-index:11}#toast.show{transform:translateX(-50%)}#toast.err{border-color:var(--r)}
#goal{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;font-size:clamp(60px,18vw,140px);font-weight:900;color:#fff;text-shadow:0 0 40px var(--g);opacity:0;z-index:8}#goal.go{animation:goal 1s}
@keyframes in{from{opacity:0;transform:translateY(14px)}}@keyframes row{from{opacity:0;transform:translateX(-24px)}}@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(.5)}50%{transform:scale(1.6);color:var(--g)}100%{transform:scale(1)}}@keyframes blink{50%{opacity:.4}}
@keyframes goal{0%{opacity:0;transform:scale(.3) rotate(-8deg)}25%{opacity:1;transform:scale(1.15)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.4)}}
@media(max-width:560px){.wrap{padding:10px}.sc{font-size:24px;min-width:64px}}
</style></head><body><div id="goal">GOL!</div><div class="wrap" id="app"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={settings:{},teams:[],matches:[],table:[]},ME={},tab='m',wk=0,htab='ozet',selTeam=null,story=null,h2hA=0,h2hB=0,bump=null;
let sfxOn=localStorage.getItem('kl_sfx')!=='0';

function playSfx(type){
 if(!sfxOn)return;
 try{
  const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;
  const ctx=new Ctx(),now=ctx.currentTime;
  if(type==='goal'){
   [523.25,659.25,783.99,1046.5].forEach((freq,i)=>{
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='triangle';o.frequency.setValueAtTime(freq,now+i*.08);
    g.gain.setValueAtTime(.18,now+i*.08);g.gain.exponentialRampToValueAtTime(.001,now+i*.08+.35);
    o.connect(g);g.connect(ctx.destination);o.start(now+i*.08);o.stop(now+i*.08+.36);
   });
  }else if(type==='whistle'){
   [0,.22].forEach((d,i)=>{
    const o=ctx.createOscillator(),g=ctx.createGain(),len=i?.42:.14;
    o.type='sine';o.frequency.setValueAtTime(2850,now+d);o.frequency.linearRampToValueAtTime(2650,now+d+len);
    g.gain.setValueAtTime(.14,now+d);g.gain.exponentialRampToValueAtTime(.001,now+d+len);
    o.connect(g);g.connect(ctx.destination);o.start(now+d);o.stop(now+d+len+.02);
   });
  }
 }catch{}
}
function toggleSfx(){sfxOn=!sfxOn;localStorage.setItem('kl_sfx',sfxOn?'1':'0');toast(sfxOn?'Ses efektleri açıldı':'Ses efektleri kapatıldı');render()}

async function api(m,u,b){const r=await fetch(u,{method:m,headers:{'Content-Type':'application/json','X-KL':'1'},body:b?JSON.stringify(b):undefined});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Hata');return d}
function toast(t,err){const e=$('#toast');e.textContent=t;e.className='show'+(err?' err':'');clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='',2600)}
async function act(f,ok){try{await f();if(ok)toast(ok);await load();render()}catch(e){toast(e.message,1)}}
async function load(){[S,ME]=await Promise.all([api('GET','/api/league'),api('GET','/api/me')])}
const T=id=>S.teams.find(t=>t.id===id)||{name:'?',color:'#888'};
const badge=(t,sz)=>`<span class="b" style="--c:${esc(t.color)};${sz?`width:${sz}px;height:${sz}px;font-size:${Math.round(sz*.32)}px`:''}">${esc(t.short||t.name.slice(0,3).toUpperCase())}</span>`;

function liveStandings(){
 const liveMs=S.matches.filter(m=>!m.played&&(m.hs>0||m.aws>0));
 if(!liveMs.length)return {rows:S.table.map(t=>({...t,diff:0})),hasLive:false};
 const s=S.settings,W=+s.win,D=+s.draw,L=+s.loss,baseRank={};
 S.table.forEach((t,i)=>baseRank[t.id]=i);
 const M={};
 S.table.forEach(t=>M[t.id]={...t});
 for(const m of liveMs){
  const h=M[m.home_id],a=M[m.away_id];if(!h||!a)continue;
  h.p++;a.p++;h.gf+=m.hs;h.ga+=m.aws;a.gf+=m.aws;a.ga+=m.hs;
  if(m.hs>m.aws){h.w++;a.l++;h.pts+=W;a.pts+=L}else if(m.hs<m.aws){a.w++;h.l++;a.pts+=W;h.pts+=L}else{h.d++;a.d++;h.pts+=D;a.pts+=D}
 }
 const sorted=Object.values(M).map(t=>({...t,gd:t.gf-t.ga})).sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf||a.name.localeCompare(b.name,'tr'));
 return {rows:sorted.map((t,i)=>({...t,diff:(baseRank[t.id]??i)-i})),hasLive:true};
}

function formOf(id){
 return S.matches.filter(m=>m.played&&(m.home_id===id||m.away_id===id))
  .sort((a,b)=>(a.updated||'').localeCompare(b.updated||'')||a.week-b.week||a.id-b.id)
  .slice(-5).map(m=>{const h=m.home_id===id,g1=h?m.hs:m.aws,g2=h?m.aws:m.hs;return g1>g2?'G':g1<g2?'M':'B'});
}

function statsBar(){
 const pl=S.matches.filter(m=>m.played);if(!pl.length||!S.table.length)return '';
 const topG=[...S.table].sort((a,b)=>b.gf-a.gf||b.pts-a.pts)[0];
 const playedTeams=S.table.filter(t=>t.p>0);
 const topD=playedTeams.length?[...playedTeams].sort((a,b)=>a.ga-b.ga||b.pts-a.pts)[0]:null;
 const big=[...pl].sort((a,b)=>Math.abs(b.hs-b.aws)-Math.abs(a.hs-a.aws)||(b.hs+b.aws)-(a.hs+a.aws))[0];
 const bh=T(big.home_id),ba=T(big.away_id);
 let bestStreak={name:'',cnt:0};
 for(const t of S.teams){
  let cur=0,mx=0;
  S.matches.filter(m=>m.played&&(m.home_id===t.id||m.away_id===t.id))
   .sort((a,b)=>(a.updated||'').localeCompare(b.updated||'')||a.week-b.week||a.id-b.id)
   .forEach(m=>{const h=m.home_id===t.id,win=h?m.hs>m.aws:m.aws>m.hs;if(win){cur++;if(cur>mx)mx=cur}else cur=0});
  if(mx>bestStreak.cnt)bestStreak={name:t.name,cnt:mx};
 }
 const totGoals=pl.reduce((s,m)=>s+m.hs+m.aws,0),avg=(totGoals/pl.length).toFixed(1);
 return `<div class="stats">
  <div class="st"><small>🔥 En Golcü Takım</small><b>${esc(topG.name)} (${topG.gf} gol)</b></div>
  ${topD?`<div class="st"><small>🛡️ En İyi Savunma</small><b>${esc(topD.name)} (${topD.ga} gol yedi)</b></div>`:''}
  <div class="st"><small>⚡ En Farklı Skor (H${big.week})</small><b>${esc(bh.name)} ${big.hs} - ${big.aws} ${esc(ba.name)}</b></div>
  ${bestStreak.cnt>1?`<div class="st"><small>🚀 En Uzun Galibiyet Serisi</small><b>${esc(bestStreak.name)} (${bestStreak.cnt} maç)</b></div>`:''}
  <div class="st"><small>⚽ Gol Ortalaması</small><b>Maç başı ${avg} gol</b></div>
 </div>`;
}

function h2hSection(){
 if(S.teams.length<2)return '';
 if(!h2hA||!S.teams.some(t=>t.id===h2hA))h2hA=S.teams[0].id;
 if(!h2hB||!S.teams.some(t=>t.id===h2hB)||h2hB===h2hA)h2hB=(S.teams.find(t=>t.id!==h2hA)||S.teams[1]).id;
 const tA=T(h2hA),tB=T(h2hB);
 const duos=S.matches.filter(m=>m.played&&((m.home_id===h2hA&&m.away_id===h2hB)||(m.home_id===h2hB&&m.away_id===h2hA)));
 let wA=0,wB=0,dr=0,gA=0,gB=0;
 duos.forEach(m=>{
  const aHome=m.home_id===h2hA,sA=aHome?m.hs:m.aws,sB=aHome?m.aws:m.hs;
  gA+=sA;gB+=sB;if(sA>sB)wA++;else if(sB>sA)wB++;else dr++;
 });
 return `<div class="sh"><h2>Kafa Kafaya Rekabet (H2H)</h2></div>
 <div class="card">
  <div class="row">
   <select onchange="h2hA=+this.value;render()">${S.teams.map(t=>`<option value="${t.id}" ${t.id===h2hA?'selected':''}>${esc(t.name)}`).join('')}</select>
   <select onchange="h2hB=+this.value;render()">${S.teams.map(t=>`<option value="${t.id}" ${t.id===h2hB?'selected':''}>${esc(t.name)}`).join('')}</select>
  </div>
  <div class="h2h-grid">
   <div>${badge(tA,46)}<div style="margin-top:6px;font-weight:700">${esc(tA.name)}</div><div class="mut">Toplam ${gA} gol</div></div>
   <div class="h2h-mid">
    <div class="h2h-nums"><span style="color:var(--g)">${wA}</span><span class="mut">-</span><span>${dr}</span><span class="mut">-</span><span style="color:var(--b)">${wB}</span></div>
    <div class="mut">${duos.length?`${duos.length} maç (G - B - G)`:'Henüz karşılaşmadılar'}</div>
   </div>
   <div>${badge(tB,46)}<div style="margin-top:6px;font-weight:700">${esc(tB.name)}</div><div class="mut">Toplam ${gB} gol</div></div>
  </div>
 </div>`;
}

function copyTable(){
 const lines=[`🏆 ${S.settings.name} — Puan Durumu (Hafta ${S.settings.week})`,''];
 S.table.forEach((t,i)=>lines.push(`${i+1}. ${t.name} | O:${t.p} G:${t.w} B:${t.d} M:${t.l} Av:${t.gd>0?'+':''}${t.gd} P:${t.pts}`));
 navigator.clipboard?.writeText(lines.join('\n')).then(()=>toast('Puan durumu panoya kopyalandı!')).catch(()=>toast('Kopyalanamadı',1));
}

function mcard(m,adm){const h=T(m.home_id),a=T(m.away_id),live=!m.played&&(m.hs||m.aws),b=bump===m.id;
 return `<div class="m">${!adm?`<button class="pbtn" title="Hikâye Kartı" onclick="story={type:'match',id:${m.id}};render()">📱</button>`:''}<div class="t">${badge(h)}${esc(h.name)}</div><div class="sc ${b?'pop':''}"><span>${m.hs} - ${m.aws}</span><small>${m.played?'Bitti · H'+m.week:live?'<span class="tag live">CANLI</span> · H'+m.week:'Hafta '+m.week}</small></div><div class="t">${badge(a)}${esc(a.name)}</div>
 ${adm?`<div class="mc"><div class="ctr"><button class="gb" onclick="g(${m.id},'hs',-1)">−</button><button class="gb plus" onclick="g(${m.id},'hs',1)">+</button></div><button onclick="fin(${m.id},${m.played?0:1})">${m.played?'↩ Aç':'✔ Bitir'}</button><button class="dng" onclick="delM(${m.id})">🗑</button><div class="ctr"><button class="gb" onclick="g(${m.id},'aws',-1)">−</button><button class="gb plus" onclick="g(${m.id},'aws',1)">+</button></div></div>`:''}</div>`}

function storyModal(){
 if(!story)return '';
 let inner='';
 if(story.type==='table'){
  const rows=S.table.slice(0,8);
  inner=`<div class="story-head"><div class="story-sub">SEZON ${esc(S.settings.season)} · HAFTA ${esc(S.settings.week)}</div><h3>🏆 ${esc(S.settings.name)}</h3><div class="story-sub">PUAN DURUMU</div></div>
  <div>${rows.map((t,i)=>`<div class="story-row"><span><b>${i+1}.</b> ${badge(t,24)}${esc(t.name)}</span><span><span class="mut" style="margin-right:8px">${t.p}O</span><b style="color:var(--g)">${t.pts} P</b></span></div>`).join('')}</div>`;
 }else if(story.type==='match'){
  const m=S.matches.find(x=>x.id===story.id);if(!m){story=null;return ''}
  const h=T(m.home_id),a=T(m.away_id);
  inner=`<div class="story-head"><div class="story-sub">SEZON ${esc(S.settings.season)} · HAFTA ${m.week}</div><h3>🏆 ${esc(S.settings.name)}</h3></div>
  <div class="story-match"><div class="tag">${m.played?'MAÇ SONUCU':'CANLI SKOR'}</div>
   <div class="story-teams">
    <div>${badge(h,54)}<div style="margin-top:8px;font-weight:700;font-size:14px">${esc(h.name)}</div></div>
    <div style="font-size:36px;font-weight:900;letter-spacing:2px">${m.hs} - ${m.aws}</div>
    <div>${badge(a,54)}<div style="margin-top:8px;font-weight:700;font-size:14px">${esc(a.name)}</div></div>
   </div>
  </div>`;
 }
 return `<div class="modal" onclick="if(event.target===this){story=null;render()}">
  <div style="display:grid;gap:10px;justify-items:center">
   <div class="story">${inner}<div class="story-foot">KARDEŞLER LİGİ · EKRAN GÖRÜNTÜSÜ AL</div></div>
   <button class="sm" onclick="story=null;render()">✕ Kapat</button>
  </div>
 </div>`;
}

function teamModal(){
 if(!selTeam)return '';
 const t=S.table.find(x=>x.id===selTeam)||T(selTeam);
 const ms=S.matches.filter(m=>m.home_id===selTeam||m.away_id===selTeam).sort((a,b)=>a.week-b.week||a.id-b.id);
 return `<div class="modal" onclick="if(event.target===this){selTeam=null;render()}"><div class="mbox">
  <div class="top"><div style="display:flex;align-items:center">${badge(t)}<div><b style="font-size:18px">${esc(t.name)}</b><div class="mut">${t.p??0} Maç · ${t.w??0}G ${t.d??0}B ${t.l??0}M · Av ${t.gd>0?'+':''}${t.gd??0} · <b>${t.pts??0} Puan</b></div></div></div>
  <button class="sm" onclick="selTeam=null;render()">✕</button></div>
  ${ms.length?`<div class="grid">${ms.map(m=>mcard(m)).join('')}</div>`:'<div class="empty">Bu takımın henüz maçı yok.</div>'}
 </div></div>`;
}

function home(){const s=S.settings,pl=S.matches.filter(m=>m.played).sort((a,b)=>(b.updated||'').localeCompare(a.updated||'')||b.id-a.id).slice(0,6),nx=S.matches.filter(m=>!m.played).slice(0,6);
 const weeks=[...new Set(S.matches.map(m=>m.week))].sort((a,b)=>a-b);
 const st=liveStandings();
 let mSec='';
 if(htab==='ozet'){
  mSec=`<div class="sh"><h2>Son Maçlar</h2></div>${pl.length?`<div class="grid">${pl.map(m=>mcard(m)).join('')}</div>`:'<div class="card empty">Henüz oynanan maç yok.</div>'}
  ${nx.length?`<div class="sh"><h2>Sıradaki Maçlar</h2></div><div class="grid">${nx.map(m=>mcard(m)).join('')}</div>`:''}`;
 }else{
  const list=htab==='all'?S.matches:S.matches.filter(m=>m.week===htab);
  mSec=list.length?`<div class="grid">${list.map(m=>mcard(m)).join('')}</div>`:'<div class="card empty">Bu seçimde maç yok.</div>';
 }
 return `<div class="hero"><h1>🏆 ${esc(s.name)}</h1><p>Sezon ${esc(s.season)}</p><div class="chips"><span class="chip">Hafta ${esc(s.week)}</span><span class="chip">${S.teams.length} takım</span><span class="chip">${S.matches.filter(m=>m.played).length} maç oynandı</span></div></div>
 ${statsBar()}
 <div class="sh"><h2>Puan Durumu</h2>${S.table.length?'<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="sm" onclick="story={type:\'table\'};render()">📱 Hikâye Kartı</button><button class="sm" onclick="copyTable()">📋 Kopyala</button></div>':''}</div>
 ${st.hasLive?'<div class="live-banner"><span class="tag live">CANLI</span> Devam eden maçların anlık skoruna göre canlı puan durumu gösteriliyor.</div>':''}
 <div class="card tw">${st.rows.length?`<table><thead><tr><th>#<th class="n">Takım<th>O<th>G<th>B<th>M<th>AG<th>YG<th>Av<th>P<th>Son 5</tr></thead><tbody>${st.rows.map((t,i)=>{const fm=formOf(t.id),mv=t.diff>0?`<span class="mv up">▲${t.diff}</span>`:t.diff<0?`<span class="mv dn">▼${Math.abs(t.diff)}</span>`:'';return `<tr style="animation-delay:${i*60}ms"><td><span class="pos">${i+1}</span>${mv}<td class="n"><span class="tlink" onclick="selTeam=${t.id};render()">${badge(t)}${esc(t.name)}</span><td>${t.p}<td>${t.w}<td>${t.d}<td>${t.l}<td>${t.gf}<td>${t.ga}<td>${t.gd>0?'+':''}${t.gd}<td class="pts">${t.pts}<td><span class="form">${fm.length?fm.map(x=>`<span class="fb ${x}">${x}</span>`).join(''):'<span class="mut">—</span>'}</span></tr>`}).join('')}</tbody></table>`:'<div class="empty">Henüz takım yok.</div>'}</div>
 ${h2hSection()}
 ${weeks.length?`<div class="sh"><h2>Maçlar & Fikstür</h2></div><div class="tabs"><button class="${htab==='ozet'?'on':''}" onclick="htab='ozet';render()">Özet</button><button class="${htab==='all'?'on':''}" onclick="htab='all';render()">Tümü (${S.matches.length})</button>${weeks.map(w=>`<button class="${htab===w?'on':''}" onclick="htab=${w};render()">H${w}</button>`).join('')}</div>${mSec}`:mSec}
 <p class="mut" style="text-align:center;margin-top:30px"><a href="#/yonetici">Yönetici girişi</a></p>${teamModal()}${storyModal()}`}

function login(){if(ME.needsSetup)return `<div class="login"><form class="card" onsubmit="return setup(event)"><h2 style="margin:0">🔐 İlk Kurulum</h2><p class="mut">Sunucu konsolunda yazan kurulum kodunu gir ve Yusuf için şifre belirle.</p><label>Kurulum kodu<input name="c" required autocomplete="off"></label><label>Yusuf'un şifresi (en az 8)<input name="p" type="password" minlength="8" required autocomplete="new-password"></label><button class="pri">Yönetici hesabını oluştur</button><a class="mut" href="#/">← Lige dön</a></form></div>`;
 return `<div class="login"><form class="card" onsubmit="return doLogin(event)"><h2 style="margin:0">🔐 Yönetici Girişi</h2><label>Kullanıcı adı<input name="u" required autocomplete="username"></label><label>Şifre<input name="p" type="password" required autocomplete="current-password"></label><button class="pri">Giriş yap</button><a class="mut" href="#/">← Lige dön</a></form></div>`}
const setup=e=>{e.preventDefault();const f=e.target;act(()=>api('POST','/api/admin/setup',{code:f.c.value,password:f.p.value}),'Hesap oluşturuldu');return false};
const doLogin=e=>{e.preventDefault();const f=e.target;act(()=>api('POST','/api/admin/login',{username:f.u.value,password:f.p.value}),'Hoş geldin Yusuf');return false};

function panel(){const weeks=[...new Set(S.matches.map(m=>m.week))].sort((a,b)=>a-b);if(!wk||!weeks.includes(wk))wk=+S.settings.week&&weeks.includes(+S.settings.week)?+S.settings.week:weeks[0]||1;
 const tabs=[['m','⚽ Maçlar'],['t','👕 Takımlar'],['f','📅 Fikstür'],['s','⚙ Ayarlar']];let c='';
 if(tab==='m')c=`<div class="tabs">${weeks.map(w=>`<button class="${w===wk?'on':''}" onclick="wk=${w};render()">H${w}</button>`).join('')}</div>${S.matches.some(m=>m.week===wk)?`<div class="grid">${S.matches.filter(m=>m.week===wk).map(m=>mcard(m,1)).join('')}</div>`:'<div class="card empty">Bu haftada maç yok. Aşağıdan ekle ya da fikstür oluştur.</div>'}
 <div class="sh"><h2>Maç Ekle</h2></div><form class="card row" onsubmit="return addM(event)"><input name="w" type="number" min="1" value="${wk}" title="Hafta"><select name="h">${S.teams.map(t=>`<option value="${t.id}">${esc(t.name)}`).join('')}</select><select name="a">${S.teams.map((t,i)=>`<option value="${t.id}" ${i==1?'selected':''}>${esc(t.name)}`).join('')}</select><button class="pri">Ekle</button></form>`;
 if(tab==='t')c=`<form class="card row" onsubmit="return addT(event)"><input name="n" placeholder="Takım adı" required maxlength="40"><input name="s" placeholder="Kısa ad" maxlength="4" style="max-width:100px"><input name="c" type="color" value="#22c55e"><button class="pri">Takım ekle</button></form><div class="grid" style="margin-top:12px">${S.teams.map(t=>`<form class="card row" onsubmit="return editT(event,${t.id})">${badge(t)}<input name="n" value="${esc(t.name)}" required maxlength="40"><input name="s" value="${esc(t.short||'')}" maxlength="4" style="max-width:80px"><input name="c" type="color" value="${esc(t.color)}"><button>💾</button><button type="button" class="dng" onclick="delT(${t.id},'${esc(t.name).replace(/'/g,'')}')">🗑</button></form>`).join('')||'<div class="card empty">Takım yok.</div>'}</div>`;
 if(tab==='f')c=`<div class="card" style="display:grid;gap:10px"><b>Otomatik Fikstür</b><p class="mut" style="margin:0">Tüm takımlar birbiriyle oynar. Mevcut (oynanmamış) fikstürün yerine yenisi yazılır; oynanmış maç varsa engellenir.</p><div class="row"><button class="pri" onclick="fx(false)">Tek devre</button><button class="pri" onclick="fx(true)">Çift devre</button></div></div>
 <div class="sh"><h2>Yeni Sezon</h2></div><form class="card row" onsubmit="return ns(event)"><input name="n" placeholder="Sezon adı (örn. 2027)" required><button class="dng">Yeni sezon başlat</button></form><p class="mut">Takımlar korunur, tüm maçlar silinir.</p>`;
 if(tab==='s'){const s=S.settings;c=`<form class="card" style="display:grid;gap:10px" onsubmit="return sv(event)"><div class="row"><label>Lig adı<input name="name" value="${esc(s.name)}" required></label><label>Sezon<input name="season" value="${esc(s.season)}" required></label><label>Güncel hafta<input name="week" type="number" min="1" value="${esc(s.week)}"></label></div><div class="row"><label>Galibiyet puanı<input name="win" type="number" min="0" value="${esc(s.win)}"></label><label>Beraberlik puanı<input name="draw" type="number" min="0" value="${esc(s.draw)}"></label><label>Mağlubiyet puanı<input name="loss" type="number" min="0" value="${esc(s.loss)}"></label></div><button class="pri">Kaydet</button></form>
 <div class="sh"><h2>Şifre Değiştir</h2></div><form class="card row" onsubmit="return pw(event)"><input name="c" type="password" placeholder="Mevcut şifre" required autocomplete="current-password"><input name="n" type="password" placeholder="Yeni şifre (en az 8)" minlength="8" required autocomplete="new-password"><button class="pri">Değiştir</button></form>
 <div class="sh"><h2>Yedek</h2></div><a href="/api/admin/backup"><button>⬇ JSON yedeği indir</button></a>`}
 return `<div class="top"><h2 style="margin:0">🛡 Yönetici Paneli — Yusuf</h2><div style="display:flex;gap:6px"><button class="sm" onclick="toggleSfx()">${sfxOn?'🔊 Ses Açık':'🔇 Ses Kapalı'}</button><a href="#/"><button class="sm">Lig</button></a><button class="sm" onclick="out()">Çıkış</button></div></div><div class="tabs">${tabs.map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';render()">${l}</button>`).join('')}</div>${c}`}

function render(){const r=location.hash.startsWith('#/yonetici');$('#app').innerHTML=!r?home():!ME.admin?login():panel();bump=null}
const out=()=>act(()=>api('POST','/api/admin/logout'),'Çıkış yapıldı');
const f=e=>(e.preventDefault(),e.target);
async function g(id,k,d){const m=S.matches.find(x=>x.id===id),v=Math.max(0,m[k]+d);if(v===m[k])return;bump=id;if(d>0){playSfx('goal');const e=$('#goal');e.className='';void e.offsetWidth;e.className='go'}
 try{await api('PUT','/api/admin/matches/'+id,{[k]:v});await load();render()}catch(e){toast(e.message,1)}}
const fin=(id,p)=>act(async()=>{if(p)playSfx('whistle');await api('PUT','/api/admin/matches/'+id,{played:p})},p?'Maç bitti, tablo güncellendi':'Maç yeniden açıldı');
const delM=id=>confirm('Maç silinsin mi?')&&act(()=>api('DELETE','/api/admin/matches/'+id),'Silindi');
const addM=e=>{const x=f(e);act(()=>api('POST','/api/admin/matches',{week:+x.w.value,home_id:+x.h.value,away_id:+x.a.value}),'Maç eklendi');return false};
const addT=e=>{const x=f(e);act(()=>api('POST','/api/admin/teams',{name:x.n.value,short:x.s.value,color:x.c.value}),'Takım eklendi');return false};
const editT=(e,id)=>{const x=f(e);act(()=>api('PUT','/api/admin/teams/'+id,{name:x.n.value,short:x.s.value,color:x.c.value}),'Kaydedildi');return false};
const delT=(id,n)=>confirm(n+' ve tüm maçları silinsin mi?')&&act(()=>api('DELETE','/api/admin/teams/'+id),'Takım silindi');
const fx=d=>act(async()=>{const r=await api('POST','/api/admin/fixture',{double:d});wk=1;tab='m';toast(r.weeks+' haftalık fikstür oluşturuldu')});
const ns=e=>{const x=f(e);confirm('Tüm maçlar silinecek. Emin misin?')&&act(()=>api('POST','/api/admin/season',{name:x.n.value}),'Yeni sezon başladı');return false};
const sv=e=>{const x=f(e),b={};new FormData(x).forEach((v,k)=>b[k]=v);act(()=>api('PUT','/api/admin/settings',b),'Ayarlar kaydedildi');return false};
const pw=e=>{const x=f(e);act(()=>api('POST','/api/admin/password',{current:x.c.value,next:x.n.value}),'Şifre değişti');x.reset();return false};
addEventListener('hashchange',()=>load().then(render));load().then(render);
const events = new EventSource('/api/events');
events.onmessage = async () => {
  if (document.hidden) return;
  try {
    await load();
    if (!location.hash.startsWith('#/yonetici')) render();
  } catch (e) {
    console.error('Canlı güncelleme hatası:', e);
  }
};
</script></body></html>
